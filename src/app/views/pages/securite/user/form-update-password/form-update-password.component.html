<section *ngIf="isAdmin">
    <form [formGroup]="form">
        <div class="row">

            <div class="col-sm-12 col-md-6 mb-3">
                <label for="password" class="form-label">Mot de passe <small style="color: red;">*</small></label>
                <p style="position: relative;">
                    <input #password type="password" class="form-control form-control-lg" id="password" placeholder="Mot de passe" formControlName="password">
                    <i (click)="togglePassword(password)" style="position: absolute; top:15px; right: 10px;" [ngClass]="{'cursor-pointer': true, 'feather': true, 'icon-eye': getIcon(password).on, 'icon-eye-off': getIcon(password).off}"></i>
                </p>
            </div>
            <div class="col-sm-12 col-md-6 mb-3">
                <label for="password" class="form-label">Confirmer Mot de passe <small style="color: red;">*</small></label>
                <p style="position: relative;">
                    <input #confirmPassword type="password" class="form-control form-control-lg" id="password" placeholder="Mot de passe" formControlName="confirmPassword">
                    <i (click)="togglePassword(confirmPassword)" style="position: absolute; top:15px; right: 10px;" [ngClass]="{'cursor-pointer': true, 'feather': true, 'icon-eye': getIcon(confirmPassword).on, 'icon-eye-off': getIcon(confirmPassword).off}"></i>
                </p>
            </div>
        </div>
      </form>
      <div class="modal-footer mt-3">
        <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
        <button type="button" class="btn btn-primary" [disabled]="!form.valid" (click)="save()">Enregistrer</button>
    </div>
</section>
