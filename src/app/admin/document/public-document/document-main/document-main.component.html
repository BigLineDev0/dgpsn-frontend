<!--Add folder-->
<ng-template #folderModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Nouveau dossier</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-folder-form (submit)="close($event)"></app-folder-form>
  </div>
</ng-template>
<!-- end add folder-->

<!--Update folder-->
<ng-template #updateFolderModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Modification dossier</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-folder-form (submit)="close($event)"></app-folder-form>
  </div>
</ng-template>
<!-- end update folder-->

<!--Add document-->
<ng-template #documentModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Nouveau document</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-document-public-form (submit)="close($event)"></app-document-public-form>
  </div>
</ng-template>
<!-- end add document-->

<!--Add document-->
<ng-template #updateDocumentModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Modification document</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-document-public-form (submit)="close($event)" [documentToEdit]="documentToEdit"></app-document-public-form>
  </div>
</ng-template>
<!-- end add document-->

<ng-template #modalView let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Lecture document</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-document-pdf [documentId]="documentId"></app-document-pdf>
  </div>
</ng-template>
