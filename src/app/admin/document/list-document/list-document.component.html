<!-- <app-form-document (submit)="refresh($event)" [agentId]="null" [category]="'AFFECTATION'" [categoryId]="categoryId"  [inputAgent]="false" [documentToUpdate]="document"></app-form-document> -->
<div class="d-flex justify-content-between mb-2">

    <ngb-accordion [closeOthers]="true" style="width: 100%; margin-right: 6px;">
        <ngb-panel id="static-1" title="Recherche">
            <ng-template ngbPanelContent>
                <app-form-document (search)="doSearch($event)" [category]="category" [issearch]="true"
                    [categoryId]="categoryId" [modal]="modalRef">
                </app-form-document>
            </ng-template>
        </ngb-panel>
    </ngb-accordion>
    <button *afHasAnyAuthority="['add']" type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(addModal, 'xl')">
        Nouveau
    </button>
</div>
<div class="row">
    <div class="col-lg-12 grid-margin stretch-card">
        <div class="card-body">
            <div class="row">
                <div class="col-lg-12">
                    <section class="table-container mat-elevation-z8" tabindex="0">
                        <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>
                        <table mat-table [dataSource]="datasource.payload" *ngIf="!loadingIndicator">
                            <ng-container matColumnDef="proprietaire">
                                <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:300px;">
                                    Libellé catégorie </th>
                                 <td mat-cell *matCellDef="let document" class="text-left">
                                    <span>
                                        {{document?.categoryLibelle}}
                                    </span>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="typeDocument">
                                <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:200px;">
                                    Type de document </th>
                                <td mat-cell *matCellDef="let document" class="text-left">
                                    {{document?.documentType?.libelle}}
                                </td>
                            </ng-container>

                            <ng-container matColumnDef="libelle">
                                <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:300px;">
                                    Libellé </th>
                                <td mat-cell *matCellDef="let document" class="text-left"> {{document?.libelle}} </td>
                            </ng-container>

                            <ng-container matColumnDef="piece">
                                <th mat-header-cell *matHeaderCellDef class="table-head-text text-center"
                                    style="min-width:100px;"> Piece </th>
                                <td mat-cell *matCellDef="let document" class="text-center">
                                    <span style="cursor: pointer;" *ngIf="!checkPdf(document)"
                                        (click)="downloadFile(document)" ngbTooltip="Télécharger">
                                        <i class="feather icon-download icon-lg text-muted" [style]="'crimson'"></i>
                                    </span>
                                    <span style="cursor: pointer;" *ngIf="checkPdf(document)" ngbTooltip="Visualiser"
                                        (click)="viewDoc(modalView, document?.id, 'xl')">
                                        <i class="feather icon-file icon-lg text-muted"></i>
                                    </span>

                                </td>
                            </ng-container>

                            <ng-container matColumnDef="actions" stickyEnd>
                                <th mat-header-cell *matHeaderCellDef class="table-head-text text-center"
                                    style="min-width:100px;"> Actions
                                </th>
                                <td mat-cell *matCellDef="let document" class="text-center">
                                    <div>
                                        <a *afHasAnyAuthority="['update']" class="me-3" role="button" ngbTooltip="modifier document" placement="left"
                                            (click)="openBasicModal(modalUpdate, 'xl', document)">
                                            <i class="feather icon-edit icon-lg text-success"></i>
                                        </a>
                                        <a *afHasAnyAuthority="['delete']" class="me-3" role="button" ngbTooltip="Supprimer document" placement="left"
                                            (click)="deleteDocument(document.id)">
                                            <i class="feather icon-trash icon-lg text-danger"></i>
                                        </a>
                                    </div>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg">
                            </tr>
                            <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
                        </table>

                        <span *ngIf="datasource?.content?.length == 0" class="paginate text-danger mt-4">Les critères de
                            recherche tels
                            qu'énoncés ne correspondent à aucun document</span>

                        <div class="paginate">
                            <ngb-pagination [collectionSize]="datasource?.metadata?.totalElements"
                                [page]="pageOptions.page+1" [pageSize]="pageOptions.size" [maxSize]="5"
                                (pageChange)="paginate($event)" size="sm" [rotate]="true" [ellipses]="true"
                                [boundaryLinks]="true">
                            </ngb-pagination>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>
<ng-template #modalView let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Lecture document</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-view-document [documentId]="documentId"></app-view-document>

    </div>
</ng-template>
<ng-template #modalUpdate let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modification document</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-form-document (submit)="refresh($event)" [category]="category" [issearch]="false" [categoryId]="categoryId"
            [documentToUpdate]="document" [modal]="modalRef"></app-form-document>
    </div>
</ng-template>
<ng-template #addModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Ajout document</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-form-document (submit)="refresh($event)" [category]="category" [categoryId]="categoryId"
            [modal]="modalRef"></app-form-document>
    </div>
</ng-template>
