<section *ngIf="!isSearch">
    <form [formGroup]="form">
        <div class="row">
            <div class="mb-3 col-md-12">
                <label class="form-label">Employé</label>
                <ng-select placeholder="Sélectionner un employé" formControlName="idEmploye">
                    <ng-option *ngFor="let employe of employes" [value]="employe.id">
                        {{ employe?.nom }} {{ employe?.prenom }}
                    </ng-option>
                </ng-select>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="form-label">Date d'inscription</label>
                <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="dateInscription">
            </div>
            <div class="mb-3 col-md-6">
                <label class="form-label">Statut de présence</label>
                <ng-select placeholder="Sélectionner un statut" formControlName="statutPresence">
                    <ng-option value="Inscrit">Inscrit</ng-option>
                    <ng-option value="Présent">Présent</ng-option>
                    <ng-option value="Absent">Absent</ng-option>
                    <ng-option value="Excusé">Excusé</ng-option>
                </ng-select>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Évaluation</label>
            <textarea rows="4" class="col-12" formControlName="evaluation"></textarea>
        </div>
    </form>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
        <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!form.valid">{{label}}</button>
    </div>
</section>
