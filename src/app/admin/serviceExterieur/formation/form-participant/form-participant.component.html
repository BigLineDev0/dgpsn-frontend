<section *ngIf="!isSearch">
    <form [formGroup]="form">
        <div class="row">
            <div class="mb-3 col-md-12">
                <label class="form-label">Agent <span class="text-danger">*</span></label>
                <ng-select placeholder="Sélectionner un employé" formControlName="agentId">
                    <ng-option *ngFor="let employe of employes" [value]="employe.id">
                        {{ employe?.nom }} {{ employe?.prenom }}
                    </ng-option>
                </ng-select>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="form-label">Date d'inscription <span class="text-danger">*</span></label>
                <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="dateInscription">
            </div>
            <div class="mb-3 col-md-6">
                <label class="form-label">Statut de participation <span class="text-danger">*</span></label>
                <ng-select placeholder="Sélectionner un statut" formControlName="statut">
                    <ng-option value="Inscrit">Inscrit</ng-option>
                    <ng-option value="Confirmé">Confirmé</ng-option>
                    <ng-option value="Présent">Présent</ng-option>
                    <ng-option value="Absent">Absent</ng-option>
                    <ng-option value="Certifié">Certifié</ng-option>
                </ng-select>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="form-label">Note d'évaluation <span class="text-danger">*</span></label>
                <input type="number" step="0.01" class="form-control" placeholder="Note (0-100)" formControlName="noteEvaluation">
            </div>
            <div class="mb-3 col-md-6">
                <label class="form-label">Certificat obtenu <span class="text-danger">*</span></label>
                <mat-checkbox formControlName="certificatObtenu">Obtenu</mat-checkbox>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Commentaires</label>
            <textarea rows="5" class="form-control" formControlName="commentaires"></textarea>
        </div>

    </form>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
        <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!form.valid">{{label}}</button>
    </div>
</section>

<section *ngIf="isSearch">
    <form [formGroup]="form">
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="form-label">Employé</label>
                <ng-select placeholder="Sélectionner un employé" formControlName="idEmploye">
                    <ng-option *ngFor="let employe of employes" [value]="employe.id">
                        {{ employe?.nom }} {{ employe?.prenom }}
                    </ng-option>
                </ng-select>
            </div>
            <div class="mb-3 col-md-6">
                <label class="form-label">Statut de participation</label>
                <ng-select placeholder="Sélectionner un statut" formControlName="statutParticipation">
                    <ng-option value="Inscrit">Inscrit</ng-option>
                    <ng-option value="Confirmé">Confirmé</ng-option>
                    <ng-option value="Présent">Présent</ng-option>
                    <ng-option value="Absent">Absent</ng-option>
                    <ng-option value="Certifié">Certifié</ng-option>
                </ng-select>
            </div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="form-label">Date d'inscription</label>
                <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="dateInscription">
            </div>
        </div>
    </form>
    <div class="modal-footer mt-2">
        <button type="button" class="btn btn-secondary" (click)="doSearch()">Rechercher</button>
    </div>
</section>
