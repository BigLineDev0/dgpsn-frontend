<section>
    <form [formGroup]="form">
        <div class="row">
            <div class="col-md-12">
                <div class="mb-3 d-flex justify-content-between w-25">
                    <div class="form-check mb-2">
                        <input type="radio" class="form-check-input" id="radioDefault" formControlName="validation" [value]="true">
                      <label class="form-check-label" for="formSwitch1">Oui</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="radioDefault1" formControlName="validation" [value]="false">
                      <label class="form-check-label" for="formSwitch2">Non</label>
                    </div>
                </div>
            </div>
            <div class="col-md-12">
                <div class="mb-3">
                    <label for="exampleFormControlTextarea1" class="form-label">Commentaire</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="5" formControlName="commentaire"></textarea>
                  </div>
            </div>

            <div class="text-end">
                <button type="button" class="btn btn-secondary me-4 mt-3" (click)="close()">Fermer</button>
                <button type="button" class="btn btn-primary mt-3" (click)="save()" [disabled]="!form.valid">Enregistrer</button>
            </div>
        </div>
    </form>
</section>
