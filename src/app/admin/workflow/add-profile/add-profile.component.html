
<div class="dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <h1 mat-dialog-title class="text-white">Configuration de validation</h1>
    <button mat-icon-button mat-dialog-close class="close-btn">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <mat-dialog-content class="content">
    <div class="grid-layout">
      
      <!-- Colonne 1 : Liste des profils -->
      <div class="profile-column">
        <mat-form-field appearance="outline" class="ww-100">
          <mat-label>Rechercher un profil</mat-label>
          <input matInput placeholder="Filtrer les profils" #filterInput>
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>
        
        <mat-selection-list 
          [multiple]="false" 
          [(ngModel)]="selectedProfils"
          (selectionChange)="getUsers()"
          class="profile-list">
          <mat-list-option 
            *ngFor="let profile of profils" 
            [value]="profile"
            class="profile-option">
            <div class="profile-item">
              <mat-icon matListIcon>account_circle</mat-icon>
              <span>{{ profile?.libelle }}</span>
            </div>
          </mat-list-option>
        </mat-selection-list>
      </div>

      <!-- Colonne 2 : Tableau des utilisateurs -->
      <div class="users-column">
        <div *ngIf="!selectedProfils" class="empty-state">
          <mat-icon>person_search</mat-icon>
          <!-- <p>Sélectionnez un profil pour voir les utilisateurs</p> -->
        </div>

        <div *ngIf="selectedProfils">
          <h4 class="profile-title">
            <mat-icon>badge</mat-icon>
              utilisateurs 
          </h4>

          <table mat-table [dataSource]="users" class="users-table mat-elevation-z2">
            
            <!-- Checkbox Column -->
            <ng-container matColumnDef="select">
              <th mat-header-cell *matHeaderCellDef>#</th>
              <td mat-cell *matCellDef="let user" class="text-center">
                <mat-checkbox 
                  [checked]="user.checked" 
                  (change)="toggleCheckBox($event, user)"
                  color="primary">
                </mat-checkbox>
              </td>
            </ng-container>

            <!-- Nom Column -->
            <ng-container matColumnDef="nom">
              <th mat-header-cell *matHeaderCellDef>Nom</th>
              <td mat-cell *matCellDef="let user">{{ user?.agent?.nom }}</td>
            </ng-container>

            <!-- Prénom Column -->
            <ng-container matColumnDef="prenom">
              <th mat-header-cell *matHeaderCellDef>Prénom</th>
              <td mat-cell *matCellDef="let user">{{ user?.agent?.prenom }}</td>
            </ng-container>

            <!-- Saut étape Column -->
            <ng-container matColumnDef="skip">
              <th mat-header-cell *matHeaderCellDef class="text-center">Saut étape</th>
              <td mat-cell *matCellDef="let user" class="text-center">
                <button 
                  mat-icon-button 
                  [matMenuTriggerFor]="stepMenu"
                  matTooltip="Saut Etape"
                  color="primary">
                  <mat-icon>hourglass_top</mat-icon>
                </button>
                
                <mat-menu #stepMenu="matMenu" class="step-menu">
                  <div class="menu-content" (click)="$event.stopPropagation()">
                    <mat-radio-group [(ngModel)]="selectedStep">
                      <mat-radio-button 
                        *ngFor="let step of steps" 
                        [value]="step.label"
                        class="step-radio">
                        {{ step.label }}
                      </mat-radio-button>
                    </mat-radio-group>
                  </div>
                </mat-menu>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
          </table>
        </div>
      </div>
    </div>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions align="end">
    <button mat-stroked-button mat-dialog-close color="warn">
      <mat-icon>close</mat-icon>
      Annuler
    </button>
    <button mat-raised-button color="primary" (click)="saveConfig()">
      <mat-icon>check</mat-icon>
      Valider
    </button>
  </mat-dialog-actions>
</div>
