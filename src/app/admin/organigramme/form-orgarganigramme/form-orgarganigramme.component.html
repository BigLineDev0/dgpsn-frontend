<section>
    <form [formGroup]="form">
        <div class="row">
            <div class="col-md-6 col-sm-12">
                <div class="mb-3">
                    <label class="form-label">Code<small style="color: red;">*</small></label>
                    <input type="text" class="form-control" placeholder="Code" formControlName="code">
                </div>
            </div>
            <div class="col-md-6 col-sm-12">
                <div class="mb-3">
                    <label class="form-label">Libellé<small style="color: red;">*</small></label>
                    <input type="text" class="form-control" placeholder="libellé" formControlName="libelle">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="close(false)">Fermer</button>
            <button [disabled]="!form.valid" type="button" class="btn btn-primary" (click)="save()">Enregistrer</button>
        </div>
    </form>
</section>
