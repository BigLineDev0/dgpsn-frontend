<div class="card">
  <div class="card-body p-0">
    <ul ngbNav #fillJustifyNav="ngbNav" class="nav-tabs nav-fill" [activeId]="1">
      <li *ngFor="let tab of alertesCategories; let i = index" [ngbNavItem]="i+1">
        <a ngbNavLink>{{ tab?.description }}</a>
        <ng-template ngbNavContent>
          <div class="mat-tab-content p-3">
            <div class="row mt-1 mb-1">
              <div class="col-12">
                <div class="card">
                  <div class="card-body p-0">
                    <ngb-accordion [closeOthers]="true">
                      <ngb-panel id="static-1" title="Recherche">
                        <ng-template ngbPanelContent>
                          <app-edit-alerte label="Rechercher" [isSearch]="true" (search)="doSearch($event)" ></app-edit-alerte>
                        </ng-template>
                      </ngb-panel>
                    </ngb-accordion>
                  </div>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-lg-12">
                <div class="d-flex justify-content-end align-content-center">
                  <!-- *afHasAnyAuthority="add" -->
                  <button  type="button" class="btn btn-primary mt-1 mb-1" (click)="openBasicModal(basicModal,tab?.typeAlertes,null,null,tab.name)">Nouveau modèle d'alerte</button>
                </div>
                <app-liste-config-alerte [categorieName]="tab.name" #listConfig></app-liste-config-alerte>
              </div>
            </div>
          </div>
        </ng-template>
      </li>
    </ul>
    <div [ngbNavOutlet]="fillJustifyNav" class="border border-top-0 p-3"></div>

<!--Add model-->
<ng-template #basicModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Nouveau model {{descCategorie}}</h5>
        <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-edit-alerte [categorieName]="categorieName" [isSearch]="false" [label]="'Enregistrer'" (submit)="close($event)"></app-edit-alerte>
    </div>
</ng-template>
<!--End Add model-->

<!--update model-->
<ng-template #updateModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modification model {{categorie}}</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-edit-alerte [isSearch]="false" [categorie]="categorie" [label]="'Modifier'" (submit)="close($event)" [templateToUpdate]="templateToUpdate"></app-edit-alerte>
    </div>
</ng-template>
<!--End update model-->
