

<app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>

<table mat-table [dataSource]="templates?.payload" *ngIf="!loadingIndicator">
  <ng-container matColumnDef="type">
    <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:200px;"> Type </th>
    <td mat-cell *matCellDef="let template" class=""> {{template?.typeAlerte?.description}} </td>
  </ng-container>

  <ng-container matColumnDef="priorite">
    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Priorité </th>
    <td mat-cell *matCellDef="let template" class="text-center">
      <span class="{{getSeverity(template?.priority?.name)}}" style="background-color: #dee2e6;">{{template?.priority?.description}}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="profils">
    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Profil </th>
    <td mat-cell *matCellDef="let template" class="text-center">
      <span *ngFor="let profile of template?.profiles" class="badge bg-primary p-1" [style]="{ 'margin-right': '4px' }">{{ profile?.libelle }}</span>
    </td>
  </ng-container>

  <ng-container matColumnDef="actions" stickyEnd>
    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:200px;"> Actions </th>
    <td mat-cell *matCellDef="let template" class="text-center">
      <div class="text-center d-inline-block">
        <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
          <mat-icon class="icon-lg text-muted">more_vert</mat-icon>
        </span>
        <mat-menu #menu="matMenu">
          <a *afHasAnyAuthority="update" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openBasicModal(updateModal,template?.typeAlerte?.name, template)">
            <span class="me-2">Modifier</span>
            <mat-icon class="text-primary icon-lg">edit</mat-icon>
          </a>
          <a *afHasAnyAuthority="delete" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteTemplate(template?.id)">
            <span class="me-2">Supprimer</span>
            <mat-icon class="text-primary icon-lg">delete</mat-icon>
          </a>
        </mat-menu>
      </div>
    </td>
  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns; sticky: true"
    class="table-head-bg"
  ></tr>
  <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
</table>

<div class="paginate">
  <ngb-pagination [collectionSize]="templates?.metadata?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                  [maxSize]="5" (pageChange)="paginate($event)" size="ml"  [rotate]="true" [ellipses]="true"
                  [boundaryLinks]="true">
  </ngb-pagination>
</div>



<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Nouveau model</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-edit-alerte [categorieName]="categorieName" [isSearch]="false" [label]="'Enregistrer'" (submit)="close($event)"></app-edit-alerte>
  </div>
</ng-template>
<!--End Add model-->

<!--update model-->
<ng-template #updateModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Modification model {{categorie}}</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-edit-alerte [isSearch]="false" [categorie]="categorie" [label]="'Modifier'" (submit)="close($event)" [templateToUpdate]="templateToUpdate"></app-edit-alerte>
  </div>
</ng-template>
<!--End update model-->
