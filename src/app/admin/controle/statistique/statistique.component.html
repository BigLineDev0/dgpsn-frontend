<div class="container-fluid p-4">

  <!-- KPIs Cards -->
  <div class="row mb-4">
    <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 mb-3" *ngFor="let kpi of kpis">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-baseline">
            <h6 class="card-title mb-0 text-uppercase fw-normal text-muted" style="font-size: 0.75rem;">
              {{ kpi.label }}
            </h6>
            <div class="dropdown mb-2">
              <div class="badge p-2 rounded" [style.background-color]="kpi.iconBgColor">
                <mat-icon [style.color]="kpi.iconColor" 
                          style="font-size: 24px; width: 24px; height: 24px;">
                  {{ kpi.icon }}
                </mat-icon>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <h3 class="mb-0" style="font-size: 1.75rem; font-weight: 600;">
                {{ kpi.value }}
              </h3>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <!-- Évolution Mensuelle -->
    <div class="col-lg-7 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title mb-4">Évolution Mensuelle</h5>
          <div style="height: 350px; position: relative;">
            <canvas id="evolutionChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Répartition Budgétaire -->
    <div class="col-lg-5 mb-4">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title mb-4">Répartition Budgétaire</h5>
          <div style="height: 350px; position: relative;">
            <canvas id="repartitionChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Alertes Budgétaires -->
  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title mb-3 d-flex align-items-center">
            <mat-icon class="me-2 text-warning">warning</mat-icon>
            Alertes Budgétaires
          </h5>

          <div class="row">
            <div class="col-lg-6 mb-3" *ngFor="let alerte of alertes">
              <div class="card border-start" [ngClass]="getAlerteClass(alerte.type)" 
                   style="border-left-width: 4px !important;">
                <div class="card-body p-3">
                  <div class="d-flex align-items-start">
                    <mat-icon [ngClass]="getAlerteIconClass(alerte.type)" 
                              class="me-3" 
                              style="font-size: 28px; width: 28px; height: 28px;">
                      {{ alerte.icon }}
                    </mat-icon>
                    <div class="flex-grow-1">
                      <h6 class="mb-1 fw-semibold">{{ alerte.titre }}</h6>
                      <p class="text-muted mb-0 small">{{ alerte.description }}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
