    <mat-tab-group
            class="report-tabs"
            [(selectedIndex)]="selectedTabIndex"
            (selectedIndexChange)="onTabChange($event)"
            animationDuration="300ms">

        <mat-tab *ngFor="let tab of tabs" [label]="tab.label">
            <ng-template mat-tab-label>
                <mat-icon class="tab-icon">{{tab.icon}}</mat-icon>
                <span class="tab-label">{{tab.label}}</span>
            </ng-template>

            <div class="tab-content">
                <app-financial-report *ngIf="tab.component === 'financial'"></app-financial-report>
                <app-administrative-report *ngIf="tab.component === 'administrative'"></app-administrative-report>
                <app-planning-report *ngIf="tab.component === 'planning'"></app-planning-report>
                <app-management-control-report *ngIf="tab.component === 'management'"></app-management-control-report>
<!--                <app-dashboard-report *ngIf="tab.component === 'dashboard'"></app-dashboard-report>-->
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
