<nav class="page-breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a routerLink=".">Referentiel</a></li>
    <li class="breadcrumb-item active" aria-current="page">Liste role</li>
  </ol>
</nav>


<div *afHasAnyAuthority="read" class="row mt-3 mb-3">
  <div class="col-12">
    <div class="card">
      <div class="card-body m-0 p-0">
        <ngb-accordion [closeOthers]="true">
          <ngb-panel id="static-1" title="Recherche">
            <ng-template ngbPanelContent>
              <app-create-or-update-role [isSearch]="true" (search)="doSearch($event)"></app-create-or-update-role>
            </ng-template>
          </ngb-panel>
        </ngb-accordion>
      </div>
    </div>
  </div>
</div>

<div class="d-flex justify-content-end align-items-baseline mt-3 mb-3">
  <!-- *afHasAnyAuthority="add" -->
<button  (click)="openBasicModal(basicModal)"  type="button" class="btn btn-primary">Nouveau rôle</button>
</div>

<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0">
      <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>

      <table mat-table [dataSource]="roles" *ngIf="!loadingIndicator">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef class="table-head-text"> Code </th>
          <td mat-cell *matCellDef="let role"> {{ role?.code}}
        </ng-container>
        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef class="table-head-text"> Libellé </th>
          <td mat-cell *matCellDef="let role"> {{ role?.libelle}}
        </ng-container>
        <ng-container matColumnDef="ugp">
          <th mat-header-cell *matHeaderCellDef class="table-head-text"> UGP </th>
          <td mat-cell *matCellDef="let role"> {{role.ugp? 'OUI': 'NON' }}
        </ng-container>

        <ng-container matColumnDef="action" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center"> Action </th>
          <td mat-cell *matCellDef="let role" class="text-center">
            <div class="text-center d-inline-block">
              <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                <i class="icon-lg text-muted" data-feather="more-vertical" appFeatherIcon></i>
              </span>
              <mat-menu #menu="matMenu">
                <a *afHasAnyAuthority="update" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openBasicModal(updateModal, role)">
                  <span class="me-2">Modifier</span>
                  <mat-icon class="text-primary icon-lg">edit</mat-icon>
                </a>
                <a *afHasAnyAuthority="delete" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteRoles(role.id)">
                  <span class="me-2">Supprimer</span>
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>
              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
      <div class="paginate">
        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page + 1"
                        [pageSize]="pageOptions.size" [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true"
                        [ellipses]="true" [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>
<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Ajout role</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-create-or-update-role (submit)="close($event)"[isSearch]="false"></app-create-or-update-role>
  </div>
</ng-template>

<ng-template #updateModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Modifier role</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-create-or-update-role (submit)="close($event)"[roleToUpdate]='roleToEdit' [isSearch]="false"></app-create-or-update-role>
  </div>
</ng-template>
