<section *ngIf="isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="mb-3 col-md-6 col-sm-12">
        <label for="colFormCodeLg" class="form-label">Code</label>
        <input type="email" class="form-control form-control-lg" id="colFormCodeLg" placeholder="Code" formControlName="code">
      </div>
      <div class="col-md-6 col-sm-12">
        <label for="colFormLabelLg" class="form-label">Libellé</label>
        <input type="email" class="form-control form-control-lg" id="colFormLabelLg" placeholder="Libellé" formControlName="libelle">
      </div>
    </div>
    <div class="mt-3">
      <div class="form-check form-switch d-inline-block">
        <label for="ugp" class="form-label">ugp</label>
        <input type="checkbox" class="form-check-input" id="sms" formControlName="ugp">
      </div>
    </div>
  </form>
  <div class="modal-footer mt-4">
    <button type="button" class="btn btn-primary" (click)="doSearch()">Rechercher</button>
  </div>

</section>

<section *ngIf="!isSearch">
  <form [formGroup]="form">
    <div class="mb-3">
      <label for="colFormCodeLg" class="form-label">Code<small style="color: red;">*</small></label>
      <input type="email" class="form-control form-control-lg" id="colFormCodeLg" placeholder="Code" formControlName="code">
    </div>
    <div>
      <label for="colFormLabelLg" class="form-label">Libellé<small style="color: red;">*</small></label>
      <input type="email" class="form-control form-control-lg" id="colFormLabelLg" placeholder="Libellé" formControlName="libelle">
    </div>
    <div class="mt-3">
      <div class="form-check form-switch d-inline-block">
        <label for="ugp" class="form-label">ugp</label>
        <input type="checkbox" class="form-check-input" id="sms" formControlName="ugp">
      </div>
    </div>
  </form>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!form.valid">Enregistrer</button>
  </div>

</section>
