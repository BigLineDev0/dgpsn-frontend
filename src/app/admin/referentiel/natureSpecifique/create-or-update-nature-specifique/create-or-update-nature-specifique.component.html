<section *ngIf="!isSearch">   
    <form [formGroup]="form">
      <div class="row">
        <div class="col-sm-4">
          <div class="mb-3">
            <label for="code" class="form-label">Code<small style="color: red;">*</small></label>
            <input type="text" class="form-control form-control-lg" id="code" placeholder="Code" formControlName="code">
            <div *ngIf="form.get('code')?.invalid && (form.get('code')?.dirty || form.get('code')?.touched)" class="text-danger">
              <div *ngIf="form.get('code')?.hasError('required')">Le code est obligatoire.</div>
              <div *ngIf="form.get('code')?.hasError('minlength')">Le code doit avoir au moins 3 caractères.</div>
              <div *ngIf="form.get('code')?.hasError('maxlength')">Le code ne peut pas dépasser 10 caractères.</div>
              <div *ngIf="form.get('code')?.hasError('pattern')">Le code ne peut contenir que des lettres et des chiffres.</div>
            </div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="mb-3">
            <label for="nom" class="form-label">Libelle<small style="color: red;">*</small></label>
            <input type="text" class="form-control form-control-lg" id="libelle" placeholder="Libelle" formControlName="libelle">
            <div *ngIf="form.get('libelle')?.invalid && (form.get('libelle')?.dirty || form.get('libelle')?.touched)" class="text-danger">
              <div *ngIf="form.get('libelle')?.hasError('required')">Le libelle est obligatoire.</div>
              <div *ngIf="form.get('libelle')?.hasError('minlength')">Le libelle doit avoir au moins 2 caractères.</div>
            </div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="mb-3">
            <label for="city" class="form-label">Nature<small style="color: red;">*</small></label>
            <ng-select 
                       bindLabel="libelle"
                       placeholder="Nature"
                       formControlName="natureId"
                    >
                    <ng-option *ngFor="let option of natures" [value]="option.id">{{ option?.libelle }}</ng-option>
            </ng-select>
          </div>
        </div>
      </div>
    </form>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
      <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!form.valid">Enregistrer</button>
    </div>
  
</section>
