
<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
    <nav class="page-breadcrumb" style="position: relative; top: 15px; left: 0px;">
        <ol class="breadcrumb ">
        <li class="breadcrumb-item active"><a>Referentiel</a></li>
        <li class="breadcrumb-item text-primary" aria-current="page">Liste nature specifiaque</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-end align-items-baseline mt-3 mb-3">
      <button (click)="openDialog(basicModal,'lg')"  type="button" class="btn btn-primary">Nouvel nature specifiaque</button>
    </div>
</div>
<div class="row mt-3 mb-3">
    <div class="col-12">
      <div class="card">
        <div class="card-body m-0 p-0">
          <ngb-accordion [closeOthers]="true">
            <ngb-panel id="static-1" title="Recherche">
              <ng-template ngbPanelContent>
                <app-create-or-update-nature-specifique (search)="doSearch($event)" [isSearch]="true"></app-create-or-update-nature-specifique>
              </ng-template>
            </ngb-panel>
          </ngb-accordion>
        </div>
      </div>
    </div>
  </div>
 

<div class="row">
    <div class="col-lg-12">
      <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">
        <!-- is only used before getting data to the api-->
        <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>
        <!-- is only used before getting data to the api-->
  
        <table mat-table [dataSource]="datasource?.content" *ngIf="!loading">
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100;"> Code </th>
            <td mat-cell *matCellDef="let natureSpecifique"> {{natureSpecifique?.code}} </td>
          </ng-container>
  
          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Libelle </th>
            <td mat-cell *matCellDef="let natureSpecifique" class=""> <span>{{natureSpecifique.libelle}} </span></td>
          </ng-container>

          <ng-container matColumnDef="nature">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Nature </th>
            <td mat-cell *matCellDef="let indicateur" class=""> <span>{{indicateur.nature.libelle}} </span></td>
          </ng-container>
          
          <ng-container matColumnDef="actions" stickyEnd>
            <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;">
              Actions </th>
            <td mat-cell *matCellDef="let natureSpecifique" class="text-center">
              <div class="text-center d-inline-block">
                <div class="text-center d-flex justify-content-between">
                  <a  ngbDropdownItem ngbTooltip="modifier" (click)="openDialog(updatenatureSpecifiqueModal, 'lg', natureSpecifique)" class="">
                    <i class="text-primary feather icon-edit"></i>
                  </a>
                  <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteNatureSpecifique(natureSpecifique?.id)"> 
                    <mat-icon class="text-danger icon-lg">delete</mat-icon>
                  </a> 
                </div>
              </div>
            </td>
          </ng-container>
          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
            class="table-head-bg"
          ></tr>
          <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
        </table>
  
        <div class="paginate">
          <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
            [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
            [boundaryLinks]="true">
          </ngb-pagination>
        </div>
      </section>
    </div>
</div>
 <!--create-or-update natureSpecifique-->
<ng-template #basicModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title">Ajout un Nature Specifique </h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-natureSpecifique="Close"></button>
    </div>
    <div class="modal-body">
      <app-create-or-update-nature-specifique [isSearch]="false" (submit)="close()"></app-create-or-update-nature-specifique>
    </div>
  </ng-template>

  <!--update natureSpecifique-->
<ng-template #updatenatureSpecifiqueModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalnatureSpecifique">Modification {{referentielType?.natureSpecifique}}</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-natureSpecifique="Close"></button>
  </div>
  <div class="modal-body">
    <app-create-or-update-nature-specifique [isSearch]="false" [natureSpecifiqueToUpdate]="natureSpecifiqueToUpdate" (submit)="close()"></app-create-or-update-nature-specifique>
  </div>
</ng-template>
