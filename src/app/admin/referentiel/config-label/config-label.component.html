<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-0">
    <nav class="page-breadcrumb cursor-pointer" style="position: relative; top: 0px; left: 0px;">
        <ol class="breadcrumb ">
            <li class="breadcrumb-item active"><a>Référentiel</a></li>
            <li class="breadcrumb-item" aria-current="page" routerLink="/referentiel">Configurations</li>
            <li class="breadcrumb-item text-primary" aria-current="page">{{ referentielType?.label }}</li>
        </ol>
    </nav>

    <div class="text-end">
      <button type="button" class="btn btn-secondary btn-icon me-2" (click)="false">
        <i class="feather icon-search"></i>
      </button>
      <button type="button" class="btn btn-primary btn-icon-text" (click)="openDialog(addLabelModal, 'lg')">
        Nouveau
      </button>
    </div>
</div>

<div class="row m">
    <div class="col-lg-12">
      <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">
        <!-- is only used before getting data to the api-->
        <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>
        <!-- is only used before getting data to the api-->
  
        <table mat-table [dataSource]="datasource?.content" *ngIf="!loading">
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef class="table-head-text"> Code </th>
            <td mat-cell *matCellDef="let label"> {{label?.code}} </td>
          </ng-container>

          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef class="table-head-text"> Libelle </th>
            <td mat-cell *matCellDef="let label" class=""> <span>{{label.libelle}} </span></td>
          </ng-container>
  
          <ng-container matColumnDef="actions" stickyEnd>
            <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="width:80px;"> Actions </th>
            <td mat-cell *matCellDef="let label" class="text-center">
              <div class="text-center d-flex justify-content-between">
                <a  ngbDropdownItem ngbTooltip="modifier" (click)="openDialog(updateLabelModal, 'lg', label)" class="">
                  <i class="text-primary feather icon-edit"></i>
                </a>
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteLabel(label?.id)"> 
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a> 
              </div>
            </td>
          </ng-container>
  
          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
            class="table-head-bg"
          ></tr>
          <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
        </table>
  
        <div class="paginate">
          <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
            [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true" [ellipses]="true"
            [boundaryLinks]="true">
          </ngb-pagination>
        </div>
      </section>
    </div>
</div>

<!--Add label-->
<ng-template #addLabelModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Ajout {{referentielType?.label}}</h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <app-form-label [referentielType]="referentielType" (submit)="close()"></app-form-label>
    </div>
</ng-template>
<!--End Add label-->

<!--update label-->
<ng-template #updateLabelModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Ajout {{referentielType?.label}}</h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <app-form-label [referentielType]="referentielType" [labelToUpdate]="labelToUpdate" (submit)="close()"></app-form-label>
    </div>
</ng-template>
<!--End update label-->
