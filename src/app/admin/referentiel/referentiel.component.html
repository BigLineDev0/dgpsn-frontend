<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-0">
  <nav class="page-breadcrumb" style="position: relative; top: 0px; left: 0px;">
    <ol class="breadcrumb">
      <li class="breadcrumb-item active"><a>Référentiel</a></li>
      <li class="breadcrumb-item text-primary" aria-current="page">Configurations</li>
    </ol>
  </nav>

  <div class="text-end">
    <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal, 'lg')">
      <i class="feather icon-search"></i>
    </button>
  </div>
</div>

<div class="row m">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">
      <!-- is only used before getting data to the api-->
      <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>
      <!-- is only used before getting data to the api-->

      <table mat-table [dataSource]="datasource.content" *ngIf="!loading">
        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Libellé</th>
          <td mat-cell *matCellDef="let referentielType"> {{ referentielType?.label }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:500px;"> Description</th>
          <td mat-cell *matCellDef="let referentielType"><span>{{ referentielType.description }}</span></td>
        </ng-container>

        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Actions</th>
          <td mat-cell *matCellDef="let referentielType" class="text-center">
            <div class="text-center d-flex justify-content-between">
              <a ngbDropdownItem ngbTooltip="configuration" (click)="navigateToConfigLabel(referentielType)">
                <i class="text-primary feather icon-settings"></i>
              </a>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
        <ngb-pagination
          [collectionSize]="datasource?.totalElements"
          [page]="pageOptions.page + 1"
          [pageSize]="pageOptions.size"
          [maxSize]="5"
          (pageChange)="paginate($event)"
          size="sm"
          [rotate]="true"
          [ellipses]="true"
          [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>

<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Rechercher un Référentiel</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="searchForm">
      <div class="row">
        <div class="col-sm-12">
          <div class="mb-3">
            <label for="libelle" class="form-label">Libellé</label>
            <input type="text" class="form-control form-control-lg" id="libelle" placeholder="Libellé"
                   formControlName="libelle">
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <input type="text" class="form-control form-control-lg" id="description" placeholder="Description"
                   formControlName="description">
          </div>
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer d-flex justify-content-end">
    <button type="button" class="btn btn-secondary" (click)="modal.close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="doSearch()">Rechercher</button>
  </div>
</ng-template>
