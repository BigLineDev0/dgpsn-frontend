
<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
    <nav class="page-breadcrumb" style="position: relative; top: 15px; left: 0px;">
        <ol class="breadcrumb ">
        <li class="breadcrumb-item active"><a>Sous-secteur</a></li>
        <li class="breadcrumb-item text-primary" aria-current="page">Liste des secteurs</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-end align-items-baseline mt-3 mb-3">
        <button (click)="openBasicModal(basicModal)"  type="button" class="btn btn-primary">Nouvel sous-secteur</button>
        </div>
</div>
<div class="row mt-3 mb-3">
    <div class="col-12">
      <div class="card">
        <div class="card-body m-0 p-0">
          <ngb-accordion [closeOthers]="true">
            <ngb-panel id="static-1" title="Recherche">
              <ng-template ngbPanelContent>
                <app-form-sous-secteur [isSearch]="true" (search)="doSearch($event)"></app-form-sous-secteur>
              </ng-template>
            </ngb-panel>
          </ngb-accordion>
        </div>
      </div>
    </div>
  </div>

    <div class="col-lg-12">
      <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">

        <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>
        <!-- is only used before getting data to the api-->

        <table mat-table [dataSource]="datasource?.content" *ngIf="!loading">
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:300px;"> Code </th>
            <td mat-cell *matCellDef="let subSector"> {{subSector?.code}} </td>
          </ng-container>

          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Libelle </th>
            <td mat-cell *matCellDef="let subSector" class=""> <span>{{subSector.libelle}} </span></td>
          </ng-container>

          <ng-container matColumnDef="sector">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Secteurs </th>
            <td mat-cell *matCellDef="let subSector" class=""> <span>{{subSector.sector?.libelle}} </span></td>

<ng-container matColumnDef="actions" stickyEnd>
    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="width:80px;"> Actions </th>
    <td mat-cell *matCellDef="let label" class="text-center">
      <div class="text-center d-flex justify-content-between">
        <a  ngbDropdownItem ngbTooltip="modifier" (click)="openDialog(updateLabelModal, 'lg', label)" class="">
          <i class="text-primary feather icon-edit"></i>
        </a>
        <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteSubsector(label?.id)">
          <mat-icon class="text-primary icon-lg">delete</mat-icon>
        </a>
      </div>
    </td>
  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="displayedColumns; sticky: true"
    class="table-head-bg"
  ></tr>
  <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
</table>

<div class="paginate">
  <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
    [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true" [ellipses]="true"
    [boundaryLinks]="true">
  </ngb-pagination>
</div>
</section>
</div>
</div>

<!--update label-->
<ng-template #updateLabelModal let-modal>
<div class="modal-header">
<h5 class="modal-title" id="exampleModalLabel">Modification {{referentielType?.sector}}</h5>
<button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
</div>
<div class="modal-body">
<app-form-sous-secteur  [referentielType]="referentielType" [sousSecteurToUpdate]="sousSecteurToUpdate" (submit)="close()" [isSearch]="false"></app-form-sous-secteur >
</div>
</ng-template>
<!--End update label-->

<ng-template #basicModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title">Ajouter un sous-secteur</h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <app-form-sous-secteur  [referentielType]="referentielType" (submit)="close()" [isSearch]="false"></app-form-sous-secteur>
    </div>
  </ng-template>
