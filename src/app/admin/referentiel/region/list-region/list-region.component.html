<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
    <nav class="page-breadcrumb" style="position: relative; top: 15px; left: 0px;">
        <ol class="breadcrumb ">
            <li class="breadcrumb-item active"><a>Gestion des regions</a></li>
            <li class="breadcrumb-item breadcrumb-active" aria-current="page">Liste des regions</li>
        </ol>
    </nav>
    <div class="text-end">
        <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal, 'xl')">
            <i class="feather icon-search"></i>
        </button>
        <button type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(basicModal, 'xl')">
            <i class="feather icon-plus-circle"></i> Nouveau Region</button>
    </div>
</div>

<div class="row">
    <div class="col-lg-12">
        <section class="table-container mat-elevation-z8" tabindex="0">
            <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>
            <table mat-table [dataSource]="dataSource" *ngIf="!loadingIndicator">
                <ng-container matColumnDef="code">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:150px;"> Code </th>
                    <td mat-cell *matCellDef="let region" class="text-left"> {{region?.code}} </td>
                </ng-container>
                <ng-container matColumnDef="libelle">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:150px;"> Libelle </th>
                    <td mat-cell *matCellDef="let region" class="text-left"> {{region?.libelle}} </td>
                </ng-container>
                <ng-container matColumnDef="actions" stickyEnd>
                    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Actions </th>
                    <td mat-cell *matCellDef="let region" class="text-center">
                      <a class="me-2" role="button" ngbTooltip="Suivi" placement="left" (click)="openUrl(region?.id,'referentiel/departement')">
                        <i class="feather text-success icon-lg icon-arrow-right-circle align-middle"></i>
                      </a>
                        <div class="text-center d-inline-block">
                         <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                           <i class="feather text-muted icon-lg icon-more-vertical align-middle"></i>
                         </span>
                        </div>
                     <mat-menu #menu="matMenu">
                       <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openBasicModal(updateModal,'xl' , region)">
                         <span class="me-2">Modifier</span>
                         <mat-icon class="text-primary icon-lg">edit</mat-icon>
                       </a>
                       <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="delete(region.id)">
                         <span class="me-2">Supprimer</span>
                         <mat-icon class="text-primary icon-lg">delete</mat-icon>
                       </a>
                     </mat-menu>
                    </td>
                </ng-container>
             <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
                <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
            </table>

            <span *ngIf="metadata?.totalElements == 0" class="paginate text-danger mt-4">Aucun region trouvé</span>

            <div class="paginate">
              <ngb-pagination [collectionSize]="metadata?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                              [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
                              [boundaryLinks]="true">
              </ngb-pagination>
            </div>
        </section>
    </div>
</div>

<ng-template #basicModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Ajouter region</h5>
        <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-form-region (submit)="close($event)" [isSearch]="false"></app-form-region>
    </div>
</ng-template>

<ng-template #updateModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Modifier region</h5>
        <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-form-region (submit)="close($event)" [regionToUpdate]="regionToUpdate" [isSearch]="false"></app-form-region>
    </div>
</ng-template>

<ng-template #searchModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title">Recherche region</h5>
        <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-form-region (submit)="close($event)" (search)="doSearch($event)" [isSearch]="true"></app-form-region>
    </div>
</ng-template>
