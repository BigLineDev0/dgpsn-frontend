
<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
    <nav class="page-breadcrumb" style="position: relative; top: 15px; left: 0px;">
        <ol class="breadcrumb ">
        <li class="breadcrumb-item active"><a>Referentiel</a></li>
        <li class="breadcrumb-item text-primary" aria-current="page">Liste indicateurs</li>
        </ol>
    </nav>
    <div class="d-flex justify-content-end align-items-baseline mt-3 mb-3">
      <button (click)="openDialog(basicModal,'lg')"  type="button" class="btn btn-primary">Nouvel Indicateur</button>
    </div>
</div>
<div class="row mt-3 mb-3">
    <div class="col-12">
      <div class="card">
        <div class="card-body m-0 p-0">
          <ngb-accordion [closeOthers]="true">
            <ngb-panel id="static-1" title="Recherche">
              <ng-template ngbPanelContent>
                <app-create-or-update-indicateur (search)="doSearch($event)" [isSearch]="true"></app-create-or-update-indicateur>
              </ng-template>
            </ngb-panel>
          </ngb-accordion>
        </div>
      </div>
    </div>
  </div>
<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">
      <!-- is only used before getting data to the api-->
      <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>
      <!-- is only used before getting data to the api-->

      <table mat-table [dataSource]="datasource?.content" *ngIf="!loading">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Code </th>
          <td mat-cell *matCellDef="let indicateur"> {{indicateur?.code}} </td>
        </ng-container>

        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Libelle </th>
          <td mat-cell *matCellDef="let indicateur" class=""> <span>{{indicateur?.libelle}} </span></td>
        </ng-container>

        <ng-container matColumnDef="unite">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Unité </th>
          <td mat-cell *matCellDef="let indicateur" class=""> <span>{{indicateur?.unit?.libelle}} </span></td>
        </ng-container>

        <ng-container matColumnDef="typeIndicateur">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Type d'indicateur </th>
          <td mat-cell *matCellDef="let indicateur" class=""> <span>{{indicateur?.indicatorType?.libelle}} </span></td>
        </ng-container>
        
        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;">
            Actions </th>
          <td mat-cell *matCellDef="let indicateur" class="text-center">
            <div class="text-center d-inline-block">
              <div class="text-center d-flex justify-content-between">
                <a  ngbDropdownItem ngbTooltip="modifier" (click)="openDialog(updateindicateurModal, 'lg', indicateur)" class="">
                  <i class="text-primary feather icon-edit"></i>
                </a>
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteIndicateur(indicateur?.id)"> 
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a> 
              </div>
            </div>
          </td>
        </ng-container>
        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
          class="table-head-bg"
        ></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
          [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
          [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>
   <!--create-or-update indicateur-->
<ng-template #basicModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title">Ajout un indicateur </h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-indicateur="Close"></button>
    </div>
    <div class="modal-body">
      <app-create-or-update-indicateur [isSearch]="false" (submit)="close()"></app-create-or-update-indicateur>
    </div>
  </ng-template>

  <!--update indicateur-->
<ng-template #updateindicateurModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalindicateur">Modification {{referentielType?.indicateur}}</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-indicateur="Close"></button>
  </div>
  <div class="modal-body">
    <app-create-or-update-indicateur [isSearch]="false" [indicatorType]="indicatorType" [indicateurToUpdate]="indicateurToUpdate" (submit)="close()"></app-create-or-update-indicateur>
  </div>
</ng-template>
