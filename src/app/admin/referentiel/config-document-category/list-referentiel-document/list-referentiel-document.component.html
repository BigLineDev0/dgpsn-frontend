<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-0">
    <nav class="page-breadcrumb" style="position: relative; top: 0px; left: 0px;">
        <ol class="breadcrumb ">
        <li class="breadcrumb-item active"><a>Paramètres</a></li>
        <li class="breadcrumb-item breadcrumb-active" aria-current="page">Catégories document</li>
        </ol>
<!--      Catégories/type de document
Alertes
-->
    </nav>

    <div class="text-end">
      <button type="button" class="btn btn-secondary btn-icon me-2" (click)="false">
        <i class="feather icon-search"></i>
      </button>
      <!-- <button type="button" class="btn btn-primary btn-icon-text" (click)="false">
        Nouveau referentielTypeme
      </button> -->
    </div>
</div>

<div class="row m">
    <div class="col-lg-12">
      <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">
        <!-- is only used before getting data to the api-->
        <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>
        <!-- is only used before getting data to the api-->

        <table mat-table [dataSource]="datasource" *ngIf="!loading">
          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Libelle </th>
            <td mat-cell *matCellDef="let referentielType"> {{referentielType?.label}} </td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:500px;"> Description </th>
            <td mat-cell *matCellDef="let referentielType" class=""> <span>{{referentielType.description}} </span></td>
          </ng-container>

          <ng-container matColumnDef="actions" stickyEnd>
            <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Actions </th>
            <td mat-cell *matCellDef="let referentielType" class="text-center">
              <div class="text-center d-flex justify-content-between">
                <a  ngbDropdownItem ngbTooltip="configuration" (click)="navigateToConfigLabel(referentielType)">
                  <i class="text-primary feather icon-settings"></i>
                </a>
                <!-- <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="false">
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>  -->
              </div>
            </td>
          </ng-container>

          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
            class="table-head-bg"
          ></tr>
          <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
        </table>

        <div class="paginate">
          <ngb-pagination [collectionSize]="datasource?.length" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
            [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true" [ellipses]="true"
            [boundaryLinks]="true">
          </ngb-pagination>
        </div>
      </section>
    </div>
</div>
