<div class="row mt-3 mb-3">
    <div class="col-12">
      <div class="card">
        <div class="card-body m-0 p-0">
          <ngb-accordion [closeOthers]="true">
            <ngb-panel id="static-1" title="Recherche">
              <ng-template ngbPanelContent>
                <app-form-sous-categorie></app-form-sous-categorie>
              </ng-template>
            </ngb-panel>
          </ngb-accordion>
        </div>
      </div>
    </div>
  </div>
 

<div class="row">
    <div class="col-lg-12">
      <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">

        <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>
        <!-- is only used before getting data to the api-->
  
        <table mat-table [dataSource]="datasource?.content" *ngIf="!loading">
          <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:300px;"> Code </th>
            <td mat-cell *matCellDef="let sousCategorie"> {{sousCategorie?.code}} </td>
          </ng-container>
  
          <ng-container matColumnDef="libelle">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Libelle </th>
            <td mat-cell *matCellDef="let sousCategorie" class=""> <span>{{sousCategorie.libelle}} </span></td>
          </ng-container>

          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Categorie </th>
            <td mat-cell *matCellDef="let sousCategorie" class=""> <span>{{sousCategorie.category?.libelle}} </span></td>
          </ng-container>

<ng-container matColumnDef="actions" stickyEnd>
  <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="width:80px;"> Actions </th>
  <td mat-cell *matCellDef="let sousCategorie" class="text-center">
    <div class="text-center d-flex justify-content-between">
      <a  ngbDropdownItem ngbTooltip="modifier" (click)="openDialog(updateLabelModal, 'lg', sousCategorie)" class="">
        <i class="text-primary feather icon-edit"></i>
      </a>
      <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteSousCategories(sousCategorie?.id)"> 
        <mat-icon class="text-primary icon-lg">delete</mat-icon>
      </a> 
    </div>
  </td>
</ng-container>

<tr
  mat-header-row
  *matHeaderRowDef="displayedColumns; sticky: true"
  class="table-head-bg"
></tr>
<tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
</table>

<div class="paginate">
<ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
  [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true" [ellipses]="true"
  [boundaryLinks]="true">
</ngb-pagination>
</div>
</section>
</div>
</div>

<!--update label-->
<ng-template #updateLabelModal let-modal>
<div class="modal-header">
<h5 class="modal-title" id="exampleModalLabel">Modification {{referentielType?.sector}}</h5>
<button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
</div>
<div class="modal-body">
<app-form-sous-categorie  [referentielType]="referentielType" [sousCategorieToUpdate]="sousCategorieToUpdate" (submit)="close()"></app-form-sous-categorie >
</div>
</ng-template>
<!--End update label-->



<ng-template #basicModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title">Ajouter un sous-categorie </h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <app-form-sous-categorie [referentielType]="referentielType" (submit)="close()"></app-form-sous-categorie>
    </div>
  </ng-template>
