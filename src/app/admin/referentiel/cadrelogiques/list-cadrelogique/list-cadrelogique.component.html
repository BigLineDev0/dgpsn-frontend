
<nav class="page-breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a routerLink=".">Referentiel</a></li>
        <li class="breadcrumb-item active" aria-current="page">Liste Plan Géographique</li>
    </ol>
</nav>

<div class="row">
  <div class="col-lg-12 p-0">
    <div class="card">
      <div class="card-body p-0">
        <ul ngbNav #fillJustifyNav="ngbNav" class="nav-tabs nav-fill">
          <li [ngbNavItem]="1">
            <a ngbNavLink class="">Régions</a>
            <ng-template ngbNavContent>
              <app-region></app-region>
            </ng-template>
          </li>
          <li [ngbNavItem]="2">
            <a ngbNavLink class="">Départements</a>
            <ng-template ngbNavContent>
              <app-departement></app-departement>
            </ng-template>
          </li>
          <li [ngbNavItem]="3">
            <a ngbNavLink class="">Arrondissements</a>
            <ng-template ngbNavContent>
              <app-arrondissement></app-arrondissement>
            </ng-template>
          </li>
          <li [ngbNavItem]="4">
            <a ngbNavLink>Communes</a>
            <ng-template ngbNavContent>
              <app-commune></app-commune>
            </ng-template>
          </li>
         
        </ul>
  
        <div [ngbNavOutlet]="fillJustifyNav" class="border border-top-0 p-0"></div>
      </div>
    </div>
  </div>
</div>


<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Ajout Plan Géographique</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-create-or-update-cadrelogique (submit)="close($event)" [isSearch]="false"></app-create-or-update-cadrelogique>
  </div>
</ng-template>

<!-- updateModal pop up-->
<ng-template #updateModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Modifier Plan Géographique</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-create-or-update-cadrelogique (submit)="close($event)" [cadreLogToUpdate]="cadreLogToEdit" [isSearch]="false"></app-create-or-update-cadrelogique>
  </div>
</ng-template>
