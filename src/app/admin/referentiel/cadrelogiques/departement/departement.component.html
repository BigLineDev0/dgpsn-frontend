<div class="card-body">
    <div *afHasAnyAuthority="read" class="row mt-0 mb-2">
      <div class="col-12">
        <ngb-accordion [closeOthers]="true">
          <ngb-panel id="static-1" title="Recherche">
            <ng-template ngbPanelContent>
              <app-create-or-update-cadrelogique label="Rechercher" [isSearch]="true"
                (search)="doSearch($event)"></app-create-or-update-cadrelogique>
            </ng-template>
          </ngb-panel>
        </ngb-accordion>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12">
        <div class="d-flex justify-content-end mb-1 mt-1 mr-8">
            <button *afHasAnyAuthority="add" (click)="openBasicModal(basicModal)"  type="button" class="btn btn-primary">Nouveau département</button>
        </div>
        <section class="table-container mat-elevation-z8" tabindex="0">   
          <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>
          <table mat-table [dataSource]="datasource.content" *ngIf="!loadingIndicator">
            <ng-container matColumnDef="code">
              <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:00px;">Code</th>
              <td mat-cell *matCellDef="let region" class=""> {{region.code}} </td>
            </ng-container>

            <ng-container matColumnDef="libelle">
              <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:200px;">
                Libelle</th>
              <td mat-cell *matCellDef="let region" class="">{{region.libelle}}</td>
            </ng-container>

            <ng-container matColumnDef="region">
                <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:200px;">
                  Région</th>
                <td mat-cell *matCellDef="let region" class="">{{region.parent?.libelle}}</td>
              </ng-container>

            <ng-container matColumnDef="actions" stickyEnd>
              <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;">
                Actions </th>
              <td mat-cell *matCellDef="let region" class="text-center">
                <div class="text-center d-inline-block">
                  <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                    <i class="icon-lg text-muted" data-feather="more-vertical" appFeatherIcon></i>
                  </span>

                  <mat-menu #menu="matMenu">
                    <a *afHasAnyAuthority="update" ngbDropdownItem class="d-flex align-items-center"
                      (click)="openBasicModal(updateModal, region)">
                      <span class="me-2">Modifier</span>
                      <mat-icon class="text-primary icon-lg">edit</mat-icon>
                    </a>
                    <a *afHasAnyAuthority="delete" ngbDropdownItem
                      class="d-flex justify-content-between align-items-center" (click)="deletecadrelogs(region.id)">
                      <span class="me-2">Supprimer</span>
                      <mat-icon class="text-primary icon-lg">delete</mat-icon>
                    </a>
                  </mat-menu>
                </div>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
            <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
          </table>

          <div class="paginate">
            <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1"
              [pageSize]="pageOptions.size" [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true"
              [ellipses]="true" [boundaryLinks]="true">
            </ngb-pagination>
          </div>
        </section>
      </div>
    </div>
  </div>

  <ng-template #basicModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Ajout Département</h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <app-create-or-update-cadrelogique (submit)="close($event)" [isSearch]="false" [niveau]="niveau"></app-create-or-update-cadrelogique>
    </div>
  </ng-template>

  <!-- updateModal pop up-->
<ng-template #updateModal let-modal>
    <div class="modal-header">
      <h5 class="modal-title" id="exampleModalLabel">Modifier Département</h5>
      <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
      <app-create-or-update-cadrelogique (submit)="close($event)" [cadreLogToUpdate]="cadreLogToEdit" [isSearch]="false" [niveau]="niveau"></app-create-or-update-cadrelogique>
    </div>
  </ng-template>
