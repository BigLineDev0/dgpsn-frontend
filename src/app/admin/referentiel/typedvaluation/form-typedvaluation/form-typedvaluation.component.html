<section *ngIf="isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-md-6  col-sm-12 mb-3">
        <label class="form-label">Code</label>
        <input type="text" class="form-control" formControlName="code" placeholder="Code"/>
      </div>
      <div class="col-md-6  col-sm-12 mb-3">
        <label class="form-label">Libelle</label>
        <input type="text" class="form-control" formControlName="libelle" placeholder="Libelle"/>
      </div>
    </div>
    <div class="modal-footer mt-3">
      <button type="button" class="btn btn-primary" (click)="doSearch()">Rechercher</button>
    </div>
  </form>
</section>
<section *ngIf="!isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-md-6  col-sm-12 mb-3">
        <label class="form-label">Code</label>
        <input type="text" class="form-control" formControlName="code" placeholder="Code"/>
      <div *ngIf="form.get('code')?.invalid && form.get('code')?.touched" class="text-danger"> Ce champ est obligatoire.
      </div>
      </div>
      <div class="col-md-6  col-sm-12 mb-3">
        <label class="form-label">Libelle</label>
        <input type="text" class="form-control" formControlName="libelle" placeholder="Libelle"/>
      <div *ngIf="form.get('libelle')?.invalid && form.get('libelle')?.touched" class="text-danger"> Ce champ est obligatoire.
      </div>
      </div>
    </div>
    <div class="modal-footer">
    <div>
      <button type="button" class="btn btn-secondary me-2" (click)="close()">Fermer</button>
      <button type="button" class="btn btn-primary" [disabled]="!form.valid" (click)="save()">Enregistrer</button>
    </div>
    </div>
  </form>
</section>
