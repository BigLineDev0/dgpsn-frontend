<div class="d-flex justify-content-end align-items-end flex-wrap grid-margin mt-3">
  <div class="d-flex justify-content-end align-items-baseline">
    <button (click)="openBasicModal(basicModal)" type="button" class="btn btn-primary">
      Nouvelle Ligne Budgetaire
    </button>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb">
      <table mat-table [dataSource]="dataSource?.content">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width: 100px">
            Code
          </th>
          <td mat-cell *matCellDef="let ligne">
            <span class="badge bg-primary rounded-pill px-3 py-2 shadow-sm">
              {{ ligne?.rubrique?.code || '—' }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width: 100px">
            Libelle
          </th>
          <td mat-cell *matCellDef="let ligne">{{ ligne?.rubrique?.libelle }}</td>
        </ng-container>

        <ng-container matColumnDef="montant">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width: 100px">
            Montant
          </th>
          <td mat-cell *matCellDef="let ligne" class="">
            <span>{{ ligne.montant }} </span>
          </td>
        </ng-container>
        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width: 50px">
            Actions
          </th>
          <td mat-cell *matCellDef="let agent" class="text-center bg-white">
            <div class="d-flex justify-content-center align-items-center">
              <a ngbDropdownItem ngbTooltip="Voir Réalisation" class="d-flex align-items-center justify-content-center"
                (click)="openBudgetDetails(agent)" placement="top" container="body">
                <mat-icon color="primary" class="icon-md">insights</mat-icon>
              </a>


              <span [matMenuTriggerFor]="menu"
                class="text-center cursor-pointer d-flex align-items-center justify-content-center" matRipple>
                <mat-icon class="icon-lg text-black">more_vert</mat-icon>
              </span>
              <mat-menu #menu="matMenu" class="bg-white">
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center"
                  (click)="openBasicModal(updateAgentModal, agent)">
                  <span class="me-2">Modifier</span>
                  <mat-icon class="text-primary icon-lg">edit</mat-icon>
                </a>
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center"
                  (click)="deleteBudget(agent.id)">
                  <span class="me-2">Supprimer</span>
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>
              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>
      <span *ngIf="dataSource?.totalElements == 0" class="paginate text-danger mt-2">Aucun Ligne Budgetaire
        Enregistrer</span>
      <div class="paginate">
        <ngb-pagination [collectionSize]="dataSource?.totalElements" [page]="pageOptions.page + 1"
          [pageSize]="pageOptions.size" [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true"
          [ellipses]="true" [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>

<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Ajout Ligne Budgetaire</h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-add-lignes-charges [typeLigneBugetaire]="typeLigneBugetaire" [selectedClasseId]="selectedClasseId"
      (submit)="close($event)" [isSearch]="false"></app-add-lignes-charges>
  </div>
</ng-template>

<ng-template #updateAgentModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">
      Ajout {{ referentielType?.agent }}
    </h5>
    <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-add-lignes-charges [ligneToUpdate]="budgatToUpdate"
      (submit)="close($event)"></app-add-lignes-charges>
  </div>
</ng-template>
