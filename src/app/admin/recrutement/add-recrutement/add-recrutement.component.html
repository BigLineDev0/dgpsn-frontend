<section *ngIf="isSearch">
  <form [formGroup]="form">
    <div class="card mb-4">
      <div class="card-body">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Libellé</label>
            <input 
              type="text" 
              class="form-control form-control-lg" 
              placeholder="Rechercher par libellé" 
              formControlName="libelle" 
            />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Type de contrat</label>
            <ng-select 
                formControlName="typeContrat"
                [items]="typeContrats"
                bindLabel="libelle"
                bindValue="id"
                placeholder="Sélectionner un type de contrat">
            </ng-select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Date de début</label>
            <input 
              type="date" 
              class="form-control form-control-lg" 
              formControlName="dateDebut" 
            />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">Date de fin</label>
            <input 
              type="date" 
              class="form-control form-control-lg" 
              formControlName="dateFin" 
            />
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
      <button type="button" class="btn btn-outline-warning" (click)="resetSearch()">
        <i class="feather icon-refresh-cw"></i> Réinitialiser
      </button>
      <button type="button" class="btn btn-primary" (click)="doSearch()">
        <i class="feather icon-search"></i> Rechercher
      </button>
    </div>
  </form>
</section>


<section *ngIf="!isSearch">
  <form [formGroup]="form">
    <!-- Détails du poste -->
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="card-title">Détails du poste</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">Libellé</label>
            <input type="text" class="form-control form-control-lg" placeholder="Libellé" formControlName="libelle" />
          </div>
          <div class="col-3 mb-3" style="position: relative;">
            <label class="form-label">Type de contrat</label>
            <ng-select 
                formControlName="typeContrat"
                [items]="typeContrats"
                bindLabel="libelle"
                bindValue="id"
                placeholder="Sélectionner un type de contrat">
            </ng-select>
          </div>
          <div class="col-md-3 col-sm-12 mb-3">
            <label class="form-label">Date limite</label>
            <input type="date" class="form-control form-control-lg" formControlName="dateRecrutement" />
          </div>
        </div>
      </div>
    </div>

    <!-- Caractéristiques -->
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="card-title">Caractéristiques</h5>
      </div>
      <div formArrayName="caracteristiques">
        <div class="card-body" *ngFor="let characteristic of caracteristiques.controls; let i = index" [formGroupName]="i">
          <div class="row">
           <div class="col-md-4 col-sm-12 mb-3">
  <ng-select formControlName="categorieCaracteristique" 
             placeholder="Type de caractéristique"
             (change)="onCategorieChange($event, i)">
    <ng-option *ngFor="let item of categorieCaracteristique" [value]="item.categorieName">
      {{ item?.libelle }}
    </ng-option>
  </ng-select>
</div>

            <div class="col-md-4 col-sm-12 mb-3">
  <ng-select formControlName="caracteristique" 
             placeholder="Choisissez une caractéristique">
    <ng-option *ngFor="let item of getFilteredCaracteristiques(i)" [value]="item.id">
      {{ item?.libelle }}
    </ng-option>
  </ng-select>
</div>
            <div class="col-md-3 col-sm-12 mb-3 mt-2">
              <label class="form-label d-flex align-items-center">
                <input type="checkbox" formControlName="exige" class="form-check-input me-2" />
                Exigé ?
              </label>
            </div>
            <div class="col-1">
              <button type="button" class="btn cursor-pointer" (click)="removeCharacteristic(i)">
                <i class="mdi mdi-delete-outline"></i>
                 <!-- <Mat icon delete icon-->
                  <mat-icon class="text-danger icon-lg">delete</mat-icon>
              </button>
               <!-- <button
                      *ngIf="recrutementToUpdate"
                      mat-raised-button
                      color="warn"
                      (click)="delete(recrutementToUpdate.id)"
                      [disabled]="loading">
                      <mat-icon>delete</mat-icon> Supprimer
                    </button> -->

            </div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-center mb-2">
        <button class="btn btn-outline-primary btn-rounded cursor-pointer" type="button" (click)="addCharacteristic()">
          <i class="mdi mdi-plus-circle-outline"></i> Nouvel caractéristique
        </button>
      </div>

    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
      <button type="button" class="btn btn-primary" *ngIf="!loading" [disabled]="!form.valid" (click)="save()">Enregistrer</button>
      <button class="btn btn-primary" type="button" disabled *ngIf="loading">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        Enregistrement...
      </button>
    </div>
  </form>
</section>
