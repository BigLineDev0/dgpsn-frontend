<div class="row">
    <div class="col-6 fw-boldest">
        <label class="form-label">Critères <small style="color:red">*</small></label>
    </div>
    <div class="col-4 fw-boldest">
        <label class="form-label">Valeur <small style="color:red">*</small></label>
    </div>
    <div class="col-2"></div>
</div>

<div class="row mb-2" *ngFor="let critere of notations">
    <div class="col-6">
        <label class="form-label">{{ critere?.critere | enumLabel:'criteres'  }}</label>
    </div>

    <div class="col-4">
        <label *ngIf="!modeEdit" class="form-label">{{ critere?.valeur | enumLabel:'valeurs'  }}</label>
        <ng-select
                *ngIf="modeEdit"
                [(ngModel)]="critere.valeur"
                placeholder="Résultat"
                [clearable]="false"
                class="w-100"
        >
            <ng-option *ngFor="let v of valeurs" [value]="v.value">
                {{ v.label }}
            </ng-option>

        </ng-select>
    </div>
</div>

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="modeEdit ? saveAll() : switchModeEdit()">
        <span *ngIf="!modeEdit">Modifier</span>
        <span *ngIf="modeEdit">Enregistrer</span>
    </button>
</div>
