        </div>

                <!-- Sélecteur d'année -->
                <div class="year-selector">
                    <label for="yearSelect">Année :</label>
                    <select
                            id="yearSelect"
                            class="form-select"
                            [(ngModel)]="selectedYear"
                            (change)="applySelection()"
                    >
                        <option *ngFor="let year of availableYears" [value]="year">
                            {{ year }}
                        </option>
                    </select>
                </div>

                <!-- Sélecteur de budget (visible uniquement en mode budget) -->
<!--                <div class="budget-selector" *ngIf="searchMode === 'budget'">-->
<!--                    <label for="budgetSelect">Budget :</label>-->
<!--                    <select-->
<!--                            id="budgetSelect"-->

<!--                            [(ngModel)]="selectedBudgetId"-->

<!--                    >-->

<!--                    &lt;!&ndash; 🆕 Message de chargement des budgets &ndash;&gt;-->
<!--                    <span *ngIf="isLoadingBudgets" class="loading-text">Chargement...</span>-->
<!--                    <span *ngIf="budgetsError" class="error-text">{{ budgetsError }}</span>-->
<!--                </div>-->

                <!-- Bouton d'application -->
                <button
                        class="btn-apply"
                        (click)="applySelection()"
                        [disabled]="(searchMode === 'budget' && !selectedBudgetId) || isLoadingBudgets"
                >
                    <span class="icon">🔍</span>
                    Charger les données
                </button>
            </div>

            <!-- 🆕 Informations sur la sélection actuelle -->
            <div class="selection-info" *ngIf="ptbaParams.year">
                <div class="info-badge mode-badge">
                    <span class="info-label">Mode :</span>
                    <span class="info-value">
                        {{ searchMode === 'year' ? 'Consolidé par année' : 'Budget spécifique' }}
                    </span>
                </div>
                <div class="info-badge year-badge">
                    <span class="info-label">Année :</span>
                    <span class="info-value">{{ ptbaParams.year }}</span>
                </div>
                <div class="info-badge budget-badge" *ngIf="searchMode === 'budget' && selectedBudgetId">
                    <span class="info-label">Budget :</span>
                    <span class="info-value">{{ getBudgetName(selectedBudgetId) }}</span>
                </div>
            </div>
        </div>

        <!-- Onglets de navigation -->
        <div class="tabs-navigation">
            <button
                    class="tab-button"
                    [class.active]="activeView === 'filters'"
                    (click)="switchView('filters')">
                <span class="tab-icon">📊</span>
                <span class="tab-label">Vue avec Filtres</span>
            </button>
            <button
                    class="tab-button"
                    [class.active]="activeView === 'excel'"
                    (click)="switchView('excel')">
                <span class="tab-icon">📋</span>
                <span class="tab-label">Vue Tableau</span>
            </button>
        </div>
    </div>

    <!-- Contenu des vues -->
    <div class="views-container">
        <!-- Vue 1: Filtres + Tableau interactif -->
        <div class="view-content" *ngIf="activeView === 'filters'">
            <app-main-ptba [ptbaParams]="ptbaParams"></app-main-ptba>
        </div>

        <!-- Vue 2: Tableau Excel fidèle -->
        <div class="view-content" *ngIf="activeView === 'excel'">
            <app-ptba-table-excel [ptbaParams]="ptbaParams"></app-ptba-table-excel>
        </div>
    </div>
</div>
