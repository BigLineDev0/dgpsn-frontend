<app-routing-financement  [pageTitle]="'Documents'"></app-routing-financement  >

<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-1">
    <div></div>
  <div>
    <h6 class="text-center text-primary" ngbTooltip="PROJET">{{projet}}</h6>
  </div>
  
  <div>
    <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal)">
      <i class="feather icon-search"></i>
    </button>
    <button type="button" class="btn btn-warning btn-icon me-2" ngbTooltip="Export">
      <i class="feather icon-download"></i>
    </button>
    <!-- <button type="button" class="btn btn-info btn-icon me-2" (click)="openBasicModal(diagrammeModal)" ngbTooltip="Diagramme de gantt">
      <i class="feather icon-bar-chart-2"></i>
    </button> -->
    <button type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(basicModal)">
      <i class="feather icon-plus-circle"></i> Nouveau Document
    </button>
  </div>
  
  </div>
  
  <div class="row">
    <div class="col-lg-12">
      <div class="d-flex justify-content-end mb-3 mt-2" *ngIf="action">
        <button  *afHasAnyAuthority="add" (click)="openBasicModal(basicModal)"  type="button" class="btn btn-primary">Nouveau document</button>
      </div>
      <section class="table-container mat-elevation-z8" tabindex="0">
        <!-- is only used before getting data to the api-->
        <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>
        <!-- is only used before getting data to the api-->
  
        <table mat-table [dataSource]="documents" *ngIf="!loadingIndicator">
          <ng-container matColumnDef="titre">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Titre </th>
            <td mat-cell *matCellDef="let document"> {{document?.libelle}} </td>
          </ng-container>
  
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Date </th>
            <td mat-cell *matCellDef="let document" class="text-center"> <span> {{document?.date | date: 'dd-MM-yyyy'}} </span></td>
          </ng-container>
  
          <ng-container matColumnDef="auteur">
            <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Auteur </th>
            <td mat-cell *matCellDef="let document" class="text-center"> {{document?.author}} </td>
          </ng-container>
  
          <ng-container matColumnDef="type document">
            <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:150px;"> Type Document </th>
            <td mat-cell *matCellDef="let document"> {{document?.documentType?.libelle}} </td>
          </ng-container>
  
          <ng-container matColumnDef="piece">
            <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Piece </th>
            <td mat-cell *matCellDef="let document" class="text-center"> 
              <span style="cursor: pointer;" *ngIf="!checkPdf(document)" (click)="downloadFile(document)">
                <i  data-feather="download" [style]="'crimson'"></i>
              </span>
              <span style="cursor: pointer;" *ngIf="checkPdf(document)" (click)="viewDoc(modalView, document.id)">
                <i data-feather="file" [style]="'crimson'"></i>
              </span>
            </td>
          </ng-container>
  
          <ng-container matColumnDef="actions" stickyEnd>
            <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:200px;"> Actions </th>
            <td mat-cell *matCellDef="let document" class="text-center">
              <div class="text-center d-inline-block">
                <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                  <i class="icon-lg text-muted" data-feather="more-vertical" appFeatherIcon></i>
                </span>
  
                <mat-menu #menu="matMenu">
                  <a *afHasAnyAuthority="edit" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openBasicModal(modalEdit, document)">
                    <span class="me-2">Modifier</span>
                    <mat-icon class="text-primary icon-lg">edit</mat-icon>
                  </a>
                  <a *afHasAnyAuthority="deletes" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteDocument(document?.id)"> 
                    <span class="me-2">Supprimer</span>
                    <mat-icon class="text-primary icon-lg">delete</mat-icon>
                  </a> 
                </mat-menu>
              </div>
            </td>
          </ng-container>
  
          <tr
            mat-header-row
            *matHeaderRowDef="displayedColumns; sticky: true"
            class="table-head-bg"
          ></tr>
          <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
        </table>
  
        <div class="paginate">
          <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
            [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
            [boundaryLinks]="true">
          </ngb-pagination>
        </div>
      </section>
    </div>
  </div>
  
    <ng-template #basicModal let-modal>
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Ajout document</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <app-form-document [isSearch]="false" [projetId]="projetId" (submit)="close($event)"></app-form-document>
      </div>
    </ng-template>
    <ng-template #modalEdit let-modal>
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modification document</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <app-form-document [isSearch]="false" [projetId]="projetId" (submit)="close($event)" [documentToUpdate]="documentToEdit"></app-form-document>
      </div>
    </ng-template>
  
    <ng-template #modalView let-modal>
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Lecture document</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <!-- <app-document-pdf [documentId]="documentId"></app-document-pdf> -->
      </div>
    </ng-template>
    <ng-template #searchModal let-modal>
        <div class="modal-header">
          <h5 class="modal-title">Rechercher Documents</h5>
          <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <app-form-document [label]="'Enregistrer'" (submit)="close($event)" [projetId]="projetId" [isSearch]="true"></app-form-document>
        </div>
      </ng-template>
