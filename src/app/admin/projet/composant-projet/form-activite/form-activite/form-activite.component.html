<section *ngIf="isSearch">
  <form [formGroup]="form">
    <div class="row mt-2">
      <div class="col-md-6 col-sm-12">
        <div class="mb-3">
          <label class="form-label">Code</label>
          <input type="text" class="form-control" formControlName="nomenclature">
        </div>
      </div>
      <div class="col-md-6 col-sm-12">
        <div class="mb-3">
          <label class="form-label">Libellé</label>
          <input type="text" class="form-control" formControlName="name">
        </div>
      </div>
    </div>
    <div class="modal-footer mt-3">
      <button type="button" class="btn btn-primary" (click)="doSearch()">Rechercher</button>
      <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    </div>
  </form>
</section>
