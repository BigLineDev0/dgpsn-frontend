<div class="row">
    <div class="col-sm-12">
      <div class="mb-3">
        <label class="form-label">Fichier</label>
        <input type="file" class="form-control" (change)="fileChange($event)" accept=".jpeg, .png, .jpg">
      </div>
    </div><!-- Col -->
</div><!-- Row -->

<div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="save()">Enregistrer</button>
</div>
