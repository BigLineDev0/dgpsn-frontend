<div class="row">
  <div class="col-lg-12">
    <div class="d-flex justify-content-end mb-1">
      <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openDialog(searchModal, 'lg')">
        <i class="feather icon-search"></i>
      </button>
      <button type="button" class="btn btn-primary btn-icon-text" (click)="openDialog(basicModal, 'lg')">
        <i class="feather icon-plus-circle"></i> Nouvel objectif spécifique
      </button>
    </div>
    <section class="table-container mat-elevation-z8" tabindex="0">
      <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>

      <table mat-table [dataSource]="datasource?.content" *ngIf="!loadingIndicator">
        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Code </th>
          <td mat-cell *matCellDef="let objectif"> {{objectif?.code}} </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:300px;"> Description </th>
          <td mat-cell *matCellDef="let objectif"> {{objectif?.description}} </td>
        </ng-container>

        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:200px;"> Actions </th>
          <td mat-cell *matCellDef="let objectif" class="text-center">
            <div class="text-center d-inline-block">
                    <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                      <i class="icon-lg text-muted" data-feather="more-vertical" appFeatherIcon></i>
                    </span>

              <mat-menu #menu="matMenu">
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openDialog(objectifUpdateModal,'lg',objectif)">
                  <span class="me-2">Modifier</span>
                  <mat-icon class="text-primary icon-lg">edit</mat-icon>
                </a>
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="delete(objectif?.id)">
                  <span class="me-2">Supprimer</span>
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>
              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
          class="table-head-bg"
        ></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                        [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
                        [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>


<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Ajout objectif specifique</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
        <app-form-objectif-projet [label]="'Ajouter'" (submit)="close($event)" [isSearch]="false"></app-form-objectif-projet>
  </div>
</ng-template>

<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Rechercher objectif specifique</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
        <app-form-objectif-projet [isSearch]="true"  ></app-form-objectif-projet>
  </div>
</ng-template>


<ng-template #objectifUpdateModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Modifier objectif specifique</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>

  <div class="modal-body">
        <app-form-objectif-projet [label]="'Modifier'" (submit)="close($event)" [objectifToUpdate]="objectifToUpdate" [isSearch]="false"></app-form-objectif-projet>
  </div>
</ng-template>
