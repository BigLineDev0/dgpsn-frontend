<section *ngIf="!isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-6">
        <label class="form-label">Code</label>
        <input type="text" class="form-control form-control-lg" placeholder="code" formControlName="code">
      </div>
      <div class="col-6">
        <label class="form-label">Description</label>
        <input type="text" class="form-control form-control-lg" placeholder="Description" formControlName="description">
      </div>
    </div>
  </form>
  <div class="modal-footer mt-3">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="save()"  [disabled]="!form.valid">{{label}}</button>
  </div>
</section>

<section *ngIf="isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-6">
        <label class="form-label">Code</label>
        <input type="text" class="form-control form-control-lg" placeholder="code" formControlName="code">
      </div>
      <div class="col-6">
        <label class="form-label">Description</label>
        <input type="text" class="form-control form-control-lg" placeholder="Description" formControlName="description">
      </div>
    </div>
  </form>
  <div class="modal-footer mt-3">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="doSearch" >Rechercher</button>
  </div>
</section>
