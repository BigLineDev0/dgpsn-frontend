<section *ngIf="!isSearch">

  <form [formGroup]="form">
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">Flag<small style="color: red;">*</small></label>
          <ng-select [items]="flags"
                     bindLabel="libelle"
                     bindValue="id"
                     placeholder="flag"
                     formControlName="flagId">
          </ng-select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">Date début<small style="color: red;">*</small></label>
          <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="startDate">
          <!-- <div class="input-group wd-200 me-2 mb-2 mb-md-0" style="width: 100%;">
            <button class="btn btn-outline-primary btn-icon calendar" type="button" (click)="d1.toggle()">
              <i data-feather="calendar" appFeatherIcon></i>
            </button>
            <input class="form-control border-primary bg-transparent" placeholder="yyyy-mm-dd"
                   name="dp" ngbDatepicker #d1="ngbDatepicker" formControlName="startDate">
          </div> -->
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">Date fin<small style="color: red;">*</small></label>
          <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="endDate">
        </div>
      </div>
    </div>
  </form>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button [disabled]="!form.valid" type="button" class="btn btn-primary" (click)="save()">Enregistrer</button>
  </div>
</section>

<section *ngIf="isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">Flag</label>
          <ng-select [items]="flags"
                     bindLabel="libelle"
                     bindValue="id"
                     placeholder="flag"
                     formControlName="flagId">
          </ng-select>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">Date début</label>
          <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="startDate">
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">Date fin</label>
          <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="endDate">
        </div>
      </div>
    </div>
  </form>
  <div class="modal-footer mt-3">
    <button type="button" class="btn btn-primary" (click)="doSearch()">Rechercher</button>
  </div>
</section>
