<app-routing-avancement-projet  [addButtontitle]="'Nouvel état'" [pageTitle]="'Etat'"></app-routing-avancement-projet>
<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-1">
  <div class="row">
    <div class="mb-3 card p-0">
      <div class="card-body p-2">
        <h5 class="badge text-secondary me-1 cursor-pointer" ngbTooltip="{{libelle}}">{{libelle}}</h5>
        <!--        <i class="icon-lg text-secondary" data-feather="chevron-right" appFeatherIcon></i>-->
        <!--        <h3 class="badge text-secondary cursor-pointer" ngbTooltip="{{lancement?.libelle}}">{{lancement?.libelle | textFormatter: 'split:50'}}</h3>-->
      </div>
    </div>
  </div>
  <div>
    <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal)">
      <i class="feather icon-search"></i>
    </button>
    <button type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(basicModal)">
      <i class="feather icon-plus-circle"></i> Nouvel état
    </button>
  </div>

</div>


<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0">
      <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>

      <table mat-table [dataSource]="flags" *ngIf="!loadingIndicator">
        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Libellé </th>
          <td mat-cell *matCellDef="let flag">
            <i data-feather="alert-octagon" [style]="getColor(flag?.flag)"></i>
            {{flag.flag?.libelle}}
          </td>
        </ng-container>
        <ng-container matColumnDef="dateDebut">
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Date début
          </th>
          <td mat-cell *matCellDef="let flag" class="text-center"> <span>{{flag?.startDate | date: 'dd-MM-yyyy'}}
            </span></td>
        </ng-container>
        <ng-container matColumnDef="dateFin">
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Date fin
          </th>
          <td mat-cell *matCellDef="let flag" class="text-center"> {{flag?.endDate | date: 'dd/MM/yyyy'}} </td>
        </ng-container>

        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Actions
          </th>
          <td mat-cell *matCellDef="let flag" class="text-center">
            <div class="text-center d-inline-block">
              <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                <i class="icon-lg text-muted" data-feather="more-vertical" appFeatherIcon></i>
              </span>
              <mat-menu #menu="matMenu">

                <a ngbDropdownItem class="d-flex justify-content-between align-items-center"
                   (click)="openBasicModal(updateModal, flag)">
                  <span class="me-2">Modifier</span>
                  <mat-icon class="text-primary icon-lg">edit</mat-icon>
                </a>
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteHistoryStatus(flag?.id)">
                  <span class="me-2">Supprimer</span>
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>


              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1"
                        [pageSize]="pageOptions.size" [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true"
                        [ellipses]="true" [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>
<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Ajout etat</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-etat-projet [isSearch]="false" (submit)="close($event)"></app-form-etat-projet>
  </div>
</ng-template>
<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Rechercher etat</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-etat-projet [isSearch]="true" (search)="doSearch($event)" [projetId]="projectId"></app-form-etat-projet>
  </div>
</ng-template>


<ng-template #updateModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Modifier etat</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-etat-projet [isSearch]="false" (submit)="close($event)"
                               [flagToUpdate]="flagToUpdate"></app-form-etat-projet>
  </div>
</ng-template>
