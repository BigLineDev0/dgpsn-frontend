<section *ngIf="!isSearch">

        <input type="text" class="form-control form-control-lg" id="libelle" placeholder="Libellé" formControlName="libelle">
      </div>
      <div class="mb-3 col-6">
        <label class="form-label">Date prévue</label>
        <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="predicatedDate">

              <i data-feather="calendar" appFeatherIcon></i>

            <input class="form-control " placeholder="yyyy-mm-dd" type="text"
                name="dp" ngbDatepicker #d1="ngbDatepicker" formControlName="predicatedDate">
        </div> -->
      </div>
      <div class="mb-3 col-6">
        <label class="form-label">Date réelle</label>
        <input type="date" class="form-control" placeholder="dd-mm-yyyy" formControlName="readDate">
        <!-- <div class="input-group wd-200 me-2 mb-2 mb-md-0" style="width: 100%;">
            <button class="btn btn-outline-primary btn-icon calendar" type="button" (click)="d2.toggle()">
              <i data-feather="calendar" appFeatherIcon></i>
            </button>
            <input class="form-control" placeholder="yyyy-mm-dd"
                name="dp" ngbDatepicker #d2="ngbDatepicker" formControlName="readDate">
        </div> -->
      </div>
      <div class="mb-3">
        <label for="comment" class="form-label">Commentaire</label>
        <div>
          <textarea rows="5" class="col-12" formControlName="comment"></textarea>
        </div>
      </div>
    </div>

  </form>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!form.valid">{{label}}</button>
  </div>
</section>
