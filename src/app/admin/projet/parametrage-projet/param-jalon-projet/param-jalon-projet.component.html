<app-routing-config-projet  [addButtontitle]="'Nouveau projet'" [pageTitle]="'Jalon'"></app-routing-config-projet>


<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-1">
  <div></div>
<div>
  <h6 class="text-center text-primary" ngbTooltip="Projet">{{projetLibelle}}</h6>
</div>

<div>
  <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal)">
    <i class="feather icon-search"></i>
  </button>
  <button type="button" class="btn btn-warning btn-icon me-2" ngbTooltip="Export">
    <i class="feather icon-download"></i>
  </button>
  <!-- <button type="button" class="btn btn-info btn-icon me-2" (click)="openDiagrammeGantt(diagrammeModal)" ngbTooltip="Diagramme de gantt">
    <i class="feather icon-bar-chart-2"></i>
  </button> -->
  <button type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(basicModal)">
    <i class="feather icon-plus-circle"></i> Nouveau jalon
  </button>
</div>

</div>

<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0" style="background-color: #f9fafb;">
      <app-spinner *ngIf="loading" [displayedColumns]="displayedColumns"></app-spinner>

      <table mat-table [dataSource]="datasource?.content" *ngIf="!loading">
        <ng-container matColumnDef="jalon">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:500px;"> Jalon </th>
          <td mat-cell *matCellDef="let jalon" class=""> <span>{{jalon?.libelle}} </span></td>
        </ng-container>

        <ng-container matColumnDef="dateDebutPrevue">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;">DATE PRÉVUE</th>
          <td mat-cell *matCellDef="let jalon"> {{jalon?.predicatedDate | date: 'dd-MM-yyyy' }} </td>
        </ng-container>

        <ng-container matColumnDef="dateDebutReel">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;">DATE RÉELLE	</th>
          <td mat-cell *matCellDef="let jalon"> {{jalon?.readDate | date: 'dd-MM-yyyy'}} </td>
        </ng-container>

        <ng-container matColumnDef="comment">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;">Commentaire</th>
          <td mat-cell *matCellDef="let jalon"> {{jalon?.comment}}</td>
        </ng-container>


        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Actions </th>
          <td mat-cell *matCellDef="let jalon" class="text-center">
            <div class="text-center d-inline-block">
              <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                <i class="icon-lg text-muted" data-feather="more-vertical" appFeatherIcon></i>
              </span>
              <mat-menu #menu="matMenu">
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openBasicModal(updateModal, jalon)">
                  <span class="me-2">Modifier</span>
                  <mat-icon class="text-primary icon-lg">edit</mat-icon>
                </a>
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="delete(jalon.id)">
                  <span class="me-2">Supprimer</span>
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>
              </mat-menu>
            </div>

          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
          class="table-head-bg"
        ></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                        [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true" [ellipses]="true"
                        [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>

<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Ajout jalon</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-jalon-projet [label]="'Enregistrer'" [isSearch]="false" (submit)="close($event)" [projetId]="projetId" [isSearch]="false"></app-form-jalon-projet>
  </div>
</ng-template>

<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Rechercher jalon</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-jalon-projet [label]="'Enregistrer'" [isSearch]="true" (search)="doSearch($event)" (submit)="close($event)" [projetId]="projetId" [isSearch]="true"></app-form-jalon-projet>
  </div>
</ng-template>

<ng-template #updateModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Modifier Jalon</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
        <app-form-jalon-projet [label]="'Modifier'" [isSearch]="false" (submit)="close($event)" [milestoneToUpdate]="jalonToUpdate" [isSearch]="false"></app-form-jalon-projet>
  </div>
</ng-template>
<ng-template #diagrammeModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Diagramme de Gantt</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <!-- <app-diagramme-gantt-jalon-projet></app-diagramme-gantt-jalon-projet> -->
  </div>
</ng-template>
