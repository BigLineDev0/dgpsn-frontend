<section *ngIf="!isResearch">
  <form [formGroup]="form">
    <div class="mb-3">
      <label class="form-label">Partie prenante <small style="color: red;">*</small></label>
      <ng-select [items]="partenaires"
                 bindLabel="nom"
                 bindValue="id"
                 placeholder="Partenaires"
                 formControlName="structureId">
      </ng-select>
    </div>
<!--    <div>-->

<!--                 bindLabel="libelle"-->
<!--                 bindValue="id"-->
<!--                 placeholder="Rôles">-->
<!--      </ng-select>-->

  </form>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="save()" [disabled]="!form.valid">{{label}}</button>
  </div>
</section>
