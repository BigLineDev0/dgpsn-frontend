<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin">
  <nav class="page-breadcrumb" style="position: relative; top: 15px; left: 0px;">
    <ol class="breadcrumb ">
      <li class="breadcrumb-item active"><a>Gestions des Evaluation</a></li>
      <li class="breadcrumb-item breadcrumb-active" aria-current="page">Liste des evaluations</li>
    </ol>
  </nav>
  <div class="text-end">
    <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal, 'xl')">
      <i class="feather icon-search"></i>
    </button>
    <button type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(basicModal, 'xl')">
      <i class="feather icon-plus-circle"></i> Nouvelle Evaluation</button>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0">
      <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>
      <table mat-table [dataSource]="evaluations" *ngIf="!loadingIndicator">
        <ng-container matColumnDef="annee">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Annee </th>
          <td mat-cell *matCellDef="let evaluation" class="text-left"> {{evaluation?.annee}} </td>
        </ng-container>
        <ng-container matColumnDef="periode">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Periode </th>
          <td mat-cell *matCellDef="let evaluation" class="text-left"> {{evaluation?.periode}} </td>
        </ng-container>
        <ng-container matColumnDef="note">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:90px;"> Note Total</th>
          <td mat-cell *matCellDef="let evaluation" class="text-left"> {{evaluation?.note}} </td>
        </ng-container>
        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:90px;"> Actions </th>
          <td mat-cell *matCellDef="let evaluation" class="text-center">
            <a class="me-2 align-middle" role="button" ngbTooltip="Note" placement="left"
               (click)="openFicheModal(basicModal, evaluation)">
              <i class="icon-lg text-primary pb-3px" data-feather="clipboard" appFeatherIcon></i>
            </a>
            <a role="button" class="align-middle" ngbTooltip="Supprimer" placement="left" (click)="delete(evaluation?.id)">
              <mat-icon class="text-primary align-middle icon-lg">delete</mat-icon>
            </a>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <span *ngIf="metadata?.totalElements == 0" class="paginate text-danger mt-4">Aucun evaluation trouvé</span>

      <div class="paginate">
        <ngb-pagination [collectionSize]="metadata?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                        [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
                        [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>

<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Ajouter evaluation</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-acteur-evaluation-projet (submit)="close($event)" [isSearch]="false" [evaluation]="evaluation"></app-form-acteur-evaluation-projet>
  </div>
</ng-template>

<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Recherche evaluation</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-acteur-evaluation-projet (submit)="close($event)" (search)="doSearch($event)" [isSearch]="true"></app-form-acteur-evaluation-projet>
  </div>
</ng-template>
