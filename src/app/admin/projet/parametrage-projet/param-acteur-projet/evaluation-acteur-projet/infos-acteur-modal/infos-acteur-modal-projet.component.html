<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0">
<!--      <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>-->

      <table mat-table [dataSource]="journals">
        <ng-container matColumnDef="utilisateur">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Utilisateur </th>
          <td mat-cell *matCellDef="let log"> {{log?.user}} </td>
        </ng-container>

        <ng-container matColumnDef="actionType">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Type d'action </th>
          <td mat-cell *matCellDef="let log" > <span> {{log?.actionType}} </span></td>
        </ng-container>

        <ng-container matColumnDef="chemin">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Chemin d'accès </th>
          <td mat-cell *matCellDef="let log" > {{log?.path}} </td>
        </ng-container>

        <!-- <ng-container matColumnDef="method">
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Méthode </th>
          <td mat-cell *matCellDef="let log" class="text-center"> {{log?.method}} </td>
        </ng-container> -->

        <ng-container matColumnDef="ipAddress">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Adresse ip </th>
          <td mat-cell *matCellDef="let log" > {{log?.ipAddress}} </td>
        </ng-container>

        <ng-container matColumnDef="userAgent">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> Système </th>
          <td mat-cell *matCellDef="let log" > {{log?.userAgent}} </td>
        </ng-container>

        <!-- <ng-container matColumnDef="url">
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:250px;"> URL </th>
          <td mat-cell *matCellDef="let log" class="text-center"> {{log?.url}} </td>
        </ng-container>          -->

        <ng-container matColumnDef="creationDate">

          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:200px;"> Date </th>
          <td mat-cell *matCellDef="let log" class="text-center"> {{log?.creationDate}} </td>
<!--          <td mat-cell *matCellDef="let log" class="text-center"> {{log?.creationDate | date:'dd/MM/yyyy HH:mm:ss'}} </td>-->
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
<!--        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"-->
        <ngb-pagination [collectionSize]="journals?.length" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                        [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
                        [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>
