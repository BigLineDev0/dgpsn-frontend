<app-routing-config-projet  [addButtontitle]="'Nouveau projet'" [pageTitle]="'UGP'"></app-routing-config-projet>

<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-1">
  <div></div>
  <div>
    <h6 class="text-center text-primary" ngbTooltip="Projet">{{projetLibelle}}</h6>
  </div>

  <div>
    <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal)">
      <i class="feather icon-search"></i>
    </button>
    <button type="button" class="btn btn-warning btn-icon me-2" ngbTooltip="Import">
      <i class="feather icon-arrow-up-circle"></i>
    </button>
    <button type="button" class="btn btn-warning btn-icon me-2" ngbTooltip="Export">
      <i class="feather icon-download"></i>
    </button>
    <button type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(basicModal)">
      <i class="feather icon-plus-circle"></i> Paramétrer UGP
    </button>
  </div>

</div>

<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0">
      <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>

      <table mat-table [dataSource]="ugps" *ngIf="!loadingIndicator">
        <ng-container matColumnDef="poste cle">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:100px;"> POSTES CLÉS </th>
          <td mat-cell *matCellDef="let ugp">{{ugp?.ugpRole?.libelle}}</td>
        </ng-container>

        <ng-container matColumnDef="existe">
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:300px;"> EXISTE-IL </th>
          <td mat-cell *matCellDef="let ugp" class="text-center"> {{ugp.existed? 'OUI': 'NON'}}</td>
        </ng-container>

        <ng-container matColumnDef="occupe">
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> EST-IL OCCUPÉ </th>
          <td mat-cell *matCellDef="let ugp" class="text-center"> {{ugp.occupied? 'OUI': 'NON'}} </td>
        </ng-container>
        <ng-container matColumnDef="statut">
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:100px;"> Statut </th>
          <td mat-cell *matCellDef="let ugp" class="text-center"> {{ugp?.status}} </td>
        </ng-container>
        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:200px;"> Actions </th>
          <td mat-cell *matCellDef="let ugp" class="text-center">
            <div class="text-center d-inline-block">
                <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
                  <i class="icon-lg text-muted" data-feather="more-vertical" appFeatherIcon></i>
                </span>

              <mat-menu #menu="matMenu">
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openBasicModal(modalUpdate, ugp)">
                  <span class="me-2">Modifier</span>
                  <mat-icon class="text-primary icon-lg">edit</mat-icon>
                </a>
                <a ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="deleteUgp(ugp.id)">
                  <span class="me-2">Supprimer</span>
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>
              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns; sticky: true"
          class="table-head-bg"
        ></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                        [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
                        [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>

<!--Add Actor-->
<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Ajout UGP</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-ugp-projet (submit)="close($event)" [projetId]="projetId"
                  [isSearch]="false"></app-form-ugp-projet>
  </div>
</ng-template>
<!--End Add Acteur-->
<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Rechercher UGP</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-ugp-projet (search)="doSearch($event)" [projetId]="projetId" [isSearch]="true"></app-form-ugp-projet>
  </div>
</ng-template>
<!--Update Acteur-->
<ng-template #modalUpdate let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Modification UGP</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-ugp-projet (submit)="close($event)" [projetId]="projetId"
                  [ugpProjectToUpdate]="ugpProjectToUpdate" [isSearch]="false"></app-form-ugp-projet>
  </div>
</ng-template>
<!--End Add Acteur-->
