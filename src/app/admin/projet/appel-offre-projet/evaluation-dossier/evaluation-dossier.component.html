<section>
    <form [formGroup]="form">
        <div class="row mt-2 ">
            <div class="row">
                <div class="col-md-2">
                    <label for="colFormLabelLg" class="form-label"> Critère d'évaluation<small
                            style="color: red;">*</small></label>
                </div>

                <div class="col-md-4" style="padding-left: 203px;">
                    <label for="colFormLabelLg" class="form-label"> Valeur Attendue<small
                            style="color: red;">*</small></label>
                </div>

                <div class="col-md-3" >
                    <label for="colFormLabelLg" class="form-label" style="padding-left: 200px;"> Pondération(%)<small
                            style="color: red;">*</small></label>
                </div>
                <div class="col-md-3" >
                    <label for="colFormLabelLg" class="form-label" style="padding-left: 110px;"> Note Obtenue<small
                            style="color: red;">*</small></label>
                </div>
            </div>
            <div formArrayName="evaluation" *ngFor="let evaluat of ligneEvaluation.controls; let i = index">
                <div class="row" [formGroupName]="i">
                    <div class="col-md-4 col-sm-12">
                        <div class="mb-3">
                           

                            <input type="text" class="form-control" placeholder="Budget" readonly="true" value="Budget"
                                formControlName="passationMarketCritereId">


                        </div>
                    </div>


<!-- 
                    <div *ngIf="typeNumber" class="col-md-4 col-sm-12">
                        <div class="mb-3">
                           
                            <input type="number" class="form-control" placeholder="Valeur Attendue" readonly="true"
                                value="12">

                        </div>
                    </div> -->

                    <div class="col-md-4 col-sm-12">
                        <div class="mb-3">
                      
                            <input type="text" class="form-control" placeholder="Valeur Attendue" readonly="true"
                                value="12" formControlName="expectedValue">

                        </div>
                    </div>
                    <div class="col-md-2 col-sm-12">
                        <div class="mb-3">
                         

                            <input type="text" class="form-control" placeholder="Pondération en %" readonly="true"
                                value="20" formControlName="ponderation">

                        </div>
                    </div>

                    <div class="col-md-2 col-sm-12">
                        <div class="mb-3">
                          
                            <input type="text" class="form-control" placeholder="Note Obtenue" formControlName="note" value="">

                        </div>
                    </div>


                </div>
            </div>

            <!-- <div class="d-flex justify-content-end mb-2">
                <button type="button" class="btn btn-primary" [disabled]="!form.valid" (click)="save()">
                    Enregistrer
                </button>
            </div><br> -->


        </div>

        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="close()">
              Fermer
            </button>
            <button type="button" class="btn btn-primary" (click)="save()">
              Enregistrer
            </button>
          </div>
    </form>
</section>
