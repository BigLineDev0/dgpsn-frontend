<app-routing-appel-offre-projet  [addButtontitle]="'Nouveau plan de passation'" [pageTitle]="'Plan de passation'"></app-routing-appel-offre-projet>

<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-1">
<!--  <div></div>-->
<!--  <div>-->
<!--    <h6 class="text-center text-primary" ngbTooltip="Projet">Construction d'une école primaire</h6>-->
<!--  </div>-->
  <div class="row">
    <div class="mb-3 card p-0">
      <div class="card-body p-2">
        <h5 class="badge text-secondary me-1 cursor-pointer" ngbTooltip="{{libelle}}">{{libelle}}</h5>
<!--        <i class="icon-lg text-secondary" data-feather="chevron-right" appFeatherIcon></i>-->
<!--        <h3 class="badge text-secondary cursor-pointer" ngbTooltip="{{lancement?.libelle}}">{{lancement?.libelle | textFormatter: 'split:50'}}</h3>-->
      </div>
    </div>
  </div>
  <div>
    <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openBasicModal(searchModal)">
      <i class="feather icon-search"></i>
    </button>
    <!--  *afHasAnyAuthority="add" -->
    <button type="button" class="btn btn-primary btn-icon-text" (click)="openBasicModal(basicModal)">
      <i class="feather icon-plus-circle"></i>Nouveau plan de passation
    </button>
  </div>

</div>

<div class="row">
  <div class="col-lg-12">
    <section class="table-container mat-elevation-z8" tabindex="0">
      <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner>

      <table mat-table [dataSource]="datasource?.content" *ngIf="!loadingIndicator">
        <ng-container matColumnDef="ref">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:200px;"> Réf </th>
          <td mat-cell *matCellDef="let plan">{{plan?.reference}} </td>
        </ng-container>
        <ng-container matColumnDef="libelle">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:200px;">Libelle</th>
          <td mat-cell *matCellDef="let plan">{{plan?.libelle}} </td>
        </ng-container>

        <ng-container matColumnDef="lancement">
          <th mat-header-cell *matHeaderCellDef class="table-head-text" style="min-width:200px;">Date de publication</th>
          <td mat-cell *matCellDef="let plan">{{plan?.yearPublication | date: 'dd-MM-yyyy'}} </td>
        </ng-container>


        <ng-container matColumnDef="actions" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="min-width:200px;"> Actions </th>
          <td mat-cell *matCellDef="let plan" class="text-center">
                    <a *afHasAnyAuthority="[read]"  class="me-2" role="button" ngbTooltip="Marchés" placement="left" (click)="openMarche(plan)">
            <mat-icon class="icon-lg pb-3px text-primary">settings</mat-icon>
          </a>

          <div class="text-center d-inline-block">
            <span [matMenuTriggerFor]="menu" class="text-center cursor-pointer" matRipple>
              <mat-icon class="icon-lg text-muted">more_vert</mat-icon>
            </span>
              <mat-menu #menu="matMenu">
                <a *afHasAnyAuthority="[edit]" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="openBasicModal(modalUpdate, plan)">
                  <span class="me-2">Modifier</span>
                  <mat-icon class="text-primary icon-lg">edit</mat-icon>
                </a>
                <!-- *afHasAnyAuthority="deletes" *afHasAnyAuthority="edit"-->
                <a *afHasAnyAuthority="[deletes]" ngbDropdownItem class="d-flex justify-content-between align-items-center" (click)="delete(plan.id)">
                  <span class="me-2">Supprimer</span>
                  <mat-icon class="text-primary icon-lg">delete</mat-icon>
                </a>
              </mat-menu>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
        <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
      </table>

      <div class="paginate">
        <ngb-pagination [collectionSize]="datasource?.totalElements" [page]="pageOptions.page+1" [pageSize]="pageOptions.size"
                        [maxSize]="5" (pageChange)="paginate($event)" size="sm"  [rotate]="true" [ellipses]="true"
                        [boundaryLinks]="true">
        </ngb-pagination>
      </div>
    </section>
  </div>
</div>


<ng-template #basicModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title" id="exampleModalLabel">Ajout plan de passation</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-plan-passation-projet [label]="'Enregistrer'" (submit)="close($event)" [projetId]="projetId" [isSearch]="false"></app-form-plan-passation-projet>
  </div>
</ng-template>
<!--End Add Plan-->
<ng-template #searchModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Rechercher plan de passation</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-plan-passation-projet (search)="doSearch($event)" [projetId]="projetId" [isSearch]="true"></app-form-plan-passation-projet>
  </div>
</ng-template>
<!--Update Plan-->
<ng-template #modalUpdate let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Modification Plan de passation</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <app-form-plan-passation-projet [label]="'Modifier'" (submit)="close($event)" [projetId]="projetId"
                            [planToUpdate]="planToUpdate" [isSearch]="false"></app-form-plan-passation-projet>
  </div>
</ng-template>
<!--End Add Plan-->

<ng-template #importModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title">Importer Plan de passation</h5>
    <button type="button" class="btn-close" (click)="modal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <!-- Row -->
    <div class="row">
      <div class="col-sm-12">
        <div class="mb-3">
          <label class="form-label">Pièce jointe</label>
          <input type="file" [formEnctype]="" class="form-control" (change)="fileChange($event)"
                 accept=".pdf, .doc, .docx, .xlsx, .xls">
        </div>
      </div><!-- Col -->
    </div>
    <!-- Row -->
  </div>
  <div class="modal-footer">
    <button (click)="import()" type="button" class="btn btn-primary btn-xs me-2">Importer</button>
  </div>
</ng-template>
