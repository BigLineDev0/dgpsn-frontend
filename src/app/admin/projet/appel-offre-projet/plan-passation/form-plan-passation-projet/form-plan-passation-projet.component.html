<section *ngIf="!isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-4 mb-3">
          <label class="form-label">Réference <small style="color: red;">*</small></label>
          <input type="text" class="form-control" placeholder="Réference" formControlName="reference">
      </div>
      <div class="col-8 mb-3">
          <label class="form-label">Libelle <small style="color: red;">*</small></label>
          <input type="text" class="form-control" placeholder="libellé" formControlName="libelle">
      </div>
    </div>
    <div class="row">
      <div class="col-10 mb-3">
        <label class="form-label">Autorité Contractante</label>
        <ng-select [items]="typeEntites" bindLabel="nom" bindValue="id" placeholder="selectionner" formControlName="structureId"></ng-select>
      </div>
      <div class="col-2 mb-3">
          <label class="form-label">Annee de publication</label>
        <ng-select [items]="annees" bindLabel="year" bindValue="id" placeholder="selectionner" formControlName="yearPublication"></ng-select>

      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <label class="form-label">Commentaires</label>
        <textarea class="form-control" [rows]="5" formControlName="description"></textarea>
      </div>
    </div>
  </form>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Fermer</button>
    <button type="button" class="btn btn-primary" (click)="save()">Enregistrer</button>
  </div>
</section>

<section *ngIf="isSearch">
  <form [formGroup]="form">
    <div class="row">
      <div class="col-4 mb-3">
        <label class="form-label">Réference <small style="color: red;">*</small></label>
        <input type="text" class="form-control" placeholder="Réference">
      </div>
      <div class="col-8 mb-3">
        <label class="form-label">Libelle <small style="color: red;">*</small></label>
        <input type="text" class="form-control" placeholder="libellé">
      </div>
    </div>
  </form>
  <div class="d-flex justify-content-end">
    <button type="button" class="btn btn-primary btn-xs" (click)="doSearch()">rechercher</button>
  </div>
</section>
